  DAYTRAK — HOW TO USE
=============================================================================
  1. Double-click this file to open it in any modern browser. It works fully
     offline: no install, no account, no internet needed.
  2. New here? Open Settings and choose "Load sample data" to explore with
     examples. Remove them later with "Clear sample data".
  3. Use the left menu (or the menu button / bottom bar on phones) to move
     between Dashboard, Calendar, Workouts, BioStack, Savings, Expenses, Tasks,
     Habits, Notes and Settings.
  4. Anything with a date can repeat. Pick the repeat options and check the

  5. Every change saves automatically in THIS browser on THIS device only.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f8fc">
<title>DayTrak</title>
<style>
/* ===========================================================================
   STYLES
   =========================================================================== */
:root{
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --primary:#1a73e8; --on-primary:#ffffff; --primary-soft:#e8f0fe; --primary-text:#174ea6;
  --bg:#dfe2e7; --surface:#ffffff; --surface-2:#f1f3f4; --surface-3:#e3e5e8;
  --text:#1f1f1f; --text-2:#5f6368; --border:#dadce0; --scrim:rgba(32,33,36,.5);
  --danger:#d93025; --on-danger:#ffffff; --danger-soft:#fce8e6;
  --success:#188038; --success-soft:#e6f4ea; --warn:#8a5300; --warn-soft:#fef7e0;
  --c-workout:#1a73e8; --c-supplement:#00a3bf; --c-savings:#1e8e3e; --c-expense:#d01884; --c-task:#e8710a; --c-habit:#a142f4; --c-note:#5c6bc0; --c-occasion:#fbbc04; --c-star:var(--c-occasion);
  --c-cal:#ea4335; --c-dash:#4285f4; --card-border:#e3e6ea;
  --card-bg:#ffffff; --card-s2:#f1f3f4; --card-s3:#e3e5e8;
  --drawer-bg:#ffffff; --drawer-edge:#e3e6ea; --topbar-border:transparent;
  --card-shadow:0 1px 2px rgba(60,64,67,.10),0 4px 16px rgba(60,64,67,.13);
  --drawer-shadow:2px 0 16px rgba(60,64,67,.14);
  --shadow-1:0 1px 2px rgba(60,64,67,.08),0 2px 6px rgba(60,64,67,.08);
  --shadow-2:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --shadow-3:0 4px 6px rgba(60,64,67,.3),0 8px 24px 6px rgba(60,64,67,.18);
  --radius:16px; --topbar-h:64px; --drawer-w:256px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --primary:#8ab4f8; --on-primary:#062e6f; --primary-soft:#233a5e; --primary-text:#d2e3fc;
  --bg:#111214; --surface:#1d1e21; --surface-2:#27282c; --surface-3:#34363b;
  --text:#e8eaed; --text-2:#a9adb3; --border:#3c4043; --scrim:rgba(0,0,0,.6);
  --danger:#f28b82; --on-danger:#601410; --danger-soft:#3b2120;
  --success:#81c995; --success-soft:#1d3326; --warn:#fdd663; --warn-soft:#3a3115;
  --c-workout:#8ab4f8; --c-supplement:#4fd1c5; --c-savings:#81c995; --c-expense:#ff8bcb; --c-task:#fcad70; --c-habit:#d7aefb; --c-note:#9fa8da; --c-occasion:#fff176; --c-star:var(--c-occasion);
  --c-cal:#f28b82; --c-dash:#8ab4f8; --card-border:#2e3034;
  --card-bg:#1d1e21; --card-s2:#27282c; --card-s3:#34363b;
  --drawer-bg:#111214; --drawer-edge:#111214; --topbar-border:#3c4043;
  --card-shadow:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3); --drawer-shadow:none;
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-2:0 2px 4px rgba(0,0,0,.5),0 4px 10px 3px rgba(0,0,0,.35);
  --shadow-3:0 4px 8px rgba(0,0,0,.6),0 8px 24px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);min-width:320px}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:500}
a{color:var(--primary)}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
svg.i.sm{width:18px;height:18px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;min-width:0;padding-left:4px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}

/* ---------- Layout & navigation ---------- */
.layout{display:flex;align-items:flex-start}
.drawer{width:var(--drawer-w);flex:none;padding:12px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow:auto;background:var(--bg)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-size:18px}
.nav-item{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 18px;border-radius:24px;text-decoration:none;color:var(--text);font-weight:500;margin-bottom:2px}
.nav-item svg{color:var(--text-2)}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--primary-soft);color:var(--primary-text)}
.nav-item[aria-current="page"] svg{color:var(--primary-text)}
.nav-sep{height:1px;background:var(--border);margin:8px 12px}
main{flex:1;min-width:0;padding:16px 28px 48px;max-width:1320px}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:45}
.bottombar{display:none}
#menuBtn{display:none}
@media (max-width:1023px){
  #menuBtn{display:inline-grid}
  .drawer{position:fixed;left:0;top:0;height:100%;z-index:50;background:var(--surface);box-shadow:var(--shadow-3);transform:translateX(-105%);transition:transform .22s ease;border-radius:0 16px 16px 0;visibility:hidden}
  .drawer.open{transform:none;visibility:visible}
  .scrim.show{display:block}
  main{padding:12px 16px 40px}
}
@media (min-width:1024px){
  .drawer-head{display:none}
  /* White sidebar column (light mode) running up through the logo area; page background shows to its right. */
  .drawer{background:var(--drawer-bg);border-right:1px solid var(--drawer-edge);box-shadow:var(--drawer-shadow);z-index:5}
  .topbar{border-bottom-color:var(--topbar-border);background:linear-gradient(to right,var(--drawer-bg) calc(var(--drawer-w) - 1px),var(--drawer-edge) calc(var(--drawer-w) - 1px),var(--drawer-edge) var(--drawer-w),var(--bg) var(--drawer-w))}
}
@media (max-width:599px){
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);box-shadow:0 -1px 3px rgba(0,0,0,.15);padding-bottom:env(safe-area-inset-bottom)}
  .bottombar a,.bottombar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;font-size:12px;font-weight:500;color:var(--text-2);text-decoration:none;border:0;background:transparent;cursor:pointer;padding:4px 0}
  .bottombar [aria-current="page"]{color:var(--primary)}
  .bottombar [aria-current="page"] svg{background:var(--primary-soft);color:var(--primary-text);border-radius:14px;width:52px;padding:2px 14px;box-sizing:border-box;height:28px}
  main{padding-bottom:96px}
  .brand{font-size:18px}
}

/* ---------- Page structure ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 20px}
.page-head h1{font-size:28px;font-weight:400;line-height:1.2}
.page-head .sub{margin-top:4px;color:var(--text-2)}
.summary{margin-top:6px;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));align-items:start}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-1);padding:16px 20px 18px;min-width:0}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:44px}
.card-title{font-size:18px;font-weight:500;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.card-title .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--c,var(--primary));flex:none}
.card-title .ic svg{width:20px;height:20px}
.title-wrap{flex:1;min-width:0}
.title-wrap .card-title{display:block;overflow-wrap:anywhere}
.section-title{font-size:16px;font-weight:500;margin:18px 0 8px}
.empty{color:var(--text-2);padding:6px 0 10px}
.hint{color:var(--text-2);font-size:14px;margin-bottom:12px}
.meta{display:block;font-size:13px;color:var(--text-2);overflow-wrap:anywhere}
.overdue{color:var(--danger)}
.group-label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);margin:14px 0 2px}
.group-label:first-child{margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.badge.ok{background:var(--success-soft);color:var(--success)}
.badge.type{background:var(--surface-2);color:var(--text)}
.badge.type::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.card-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.divider{height:1px;background:var(--border);margin:12px 0}
.type-workout{--c:var(--c-workout)} .type-supplement{--c:var(--c-supplement)} .type-savings{--c:var(--c-savings)} .type-expense{--c:var(--c-expense)} .type-task{--c:var(--c-task)} .type-habit{--c:var(--c-habit)} .type-note{--c:var(--c-note)} .type-occasion{--c:var(--c-occasion)} .card-title .ic.type-occasion,.add-kind.type-occasion{--c:var(--c-star)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--primary);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn svg{width:20px;height:20px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{box-shadow:var(--shadow-1);filter:brightness(1.05)}
.btn.tonal{background:var(--primary-soft);border-color:transparent;color:var(--primary-text)}
.btn.text{border-color:transparent;background:transparent;padding:0 14px}
.btn.text:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger.primary{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;filter:none}
.btn.block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--text-2);flex:none;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed;background:transparent}
.icon-btn svg{width:22px;height:22px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field-label{font-size:13px;font-weight:500;color:var(--text-2)}
.input{min-height:44px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);width:100%;min-width:0}
textarea.input{min-height:80px;resize:vertical}
.input:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
.input[aria-invalid="true"]{border-color:var(--danger);outline-color:var(--danger)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 150px}
.field-error{color:var(--danger);font-size:14px}
.form-error:empty{display:none}
.form-error{margin:4px 0 8px;padding:10px 12px;border-radius:8px;background:var(--danger-soft)}
.check-line{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;margin-bottom:8px}
.check-line input,.radio input{width:22px;height:22px;accent-color:var(--primary);margin:0;flex:none;cursor:pointer}
.radio-group{display:flex;flex-direction:column;gap:2px}
.radio{display:flex;align-items:center;gap:14px;min-height:44px;cursor:pointer;padding:0 4px;border-radius:8px}
.radio:hover{background:var(--surface-2)}
.input-suffix{display:flex;align-items:center;gap:8px}
.input-suffix .input{max-width:110px}
.input-suffix span{color:var(--text-2)}

/* ---------- Check rows (tasks / supplements / habits) ---------- */
.check-row{display:flex;align-items:center;gap:4px;border-radius:10px;min-height:48px}
.check-row:hover{background:var(--surface-2)}
.check-hit{display:flex;align-items:center;gap:14px;flex:1;min-width:0;min-height:48px;padding:4px 8px;cursor:pointer}
.check-hit input{width:22px;height:22px;accent-color:var(--primary);margin:0;flex:none;cursor:pointer}
.check-hit .t{flex:1;min-width:0}
.name{overflow-wrap:anywhere}
.check-row.done .name,.struck{text-decoration:line-through;color:var(--text-2)}
.side{display:flex;align-items:center;gap:4px;color:var(--text-2);font-size:14px;white-space:nowrap;padding-right:6px}
.side svg{width:18px;height:18px;color:#e8710a}

/* ---------- Progress ---------- */
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.bar.full>span{background:var(--success)}
.goal-line{margin:10px 0 2px}
.goal-line .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.big-amount{font-size:28px;font-weight:400}

/* ---------- Item rows (calendar lists, upcoming) ---------- */
.item-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 8px;border-radius:10px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--text)}
.item-row:hover{background:var(--surface-2)}
.item-row .t{flex:1;min-width:0}
.item-row>svg{color:var(--text-2)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.dot.hollow{background:transparent;border:2px solid var(--c)}
.done-tag{font-size:12px;font-weight:500;color:var(--success);background:var(--success-soft);border-radius:10px;padding:2px 8px;white-space:nowrap}
.day-group+.day-group{margin-top:6px}

/* ---------- Calendar ---------- */
.cal-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.cal-title{font-size:22px;font-weight:400;margin:0 8px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:22px;overflow:hidden;background:var(--surface)}
.seg button{min-height:42px;min-width:76px;border:0;background:transparent;padding:0 16px;cursor:pointer;font-weight:500;color:var(--text)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-text)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cal-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-1);overflow:hidden}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead{padding:10px 4px 6px;text-align:center;font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.mcell{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.mcell:nth-child(7n+7){border-right:0}
.mcell:hover{background:var(--surface-2)}
.mcell.other{background:var(--bg)}
.mcell.other .mday{color:var(--text-2)}
.mday{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-weight:500;font-size:13px;align-self:center;flex:none}
.mday:hover{background:var(--surface-3)}
.mcell.today .mday{background:var(--primary);color:var(--on-primary)}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:var(--surface-2);background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--text);padding:3px 6px;border-radius:4px;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-height:22px}
.chip:hover{filter:brightness(.96)}
.chip.done{opacity:.6;text-decoration:line-through}
.more{font-size:12px;font-weight:500;color:var(--primary);border:0;background:none;text-align:left;padding:2px 6px;cursor:pointer;min-height:22px}
@media (max-width:719px){
  .mcell{min-height:68px;padding:2px 2px 4px;gap:2px}
  .mday{width:28px;height:28px;font-size:12px}
  .chip{font-size:0;min-height:5px;height:5px;padding:0;border:0;background:var(--c);pointer-events:none;border-radius:3px}
  .chip.done{opacity:.4;text-decoration:none}
  .more{font-size:11px;padding:0 2px;pointer-events:none;text-align:center;color:var(--text-2)}
  .mhead{font-size:11px;padding:8px 0 4px}
  .cal-title{font-size:18px;margin:0 4px;flex-basis:100%;order:-1}
}
.week{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr))}
.wslot.whr{font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;text-align:right;padding:2px 8px 0 4px;border-bottom:0;white-space:nowrap}
.wslot.whr.now{color:var(--c-cal);font-weight:700}
.wcell.whour{min-height:48px;border-bottom-color:color-mix(in srgb,var(--border) 60%,transparent)}
.ftoggle{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:22px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--text);transition:background .15s,opacity .15s}
.ftoggle svg{width:18px;height:18px;color:var(--c)}
.ftoggle[aria-pressed="false"]{background:transparent;border-color:var(--border);color:var(--text-2)}
.ftoggle[aria-pressed="false"] svg{color:var(--text-2)}
.ftoggle:hover{box-shadow:var(--shadow-1)}
.wcell.now{box-shadow:inset 0 2px 0 var(--c-cal)}
.wh{padding:8px 4px;text-align:center;border-bottom:1px solid var(--border);border-left:1px solid var(--border)}
.wh button{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;min-height:44px;border-radius:10px;padding:2px;color:var(--text)}
.wh button:hover{background:var(--surface-2)}
.wh .dn{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase}
.wh .dd{font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.wh.today .dd{background:var(--primary);color:var(--on-primary)}
.wslot{padding:8px;font-size:12px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
.wcell{min-height:72px;border-left:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wcell.today{background:color-mix(in srgb,var(--primary) 5%,var(--surface))}
.wchip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:var(--surface-2);background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--text);padding:4px 6px;border-radius:6px;font-size:12px;cursor:pointer;min-height:44px;overflow:hidden}
.wchip .wt{display:block;font-weight:600;color:var(--text-2);font-size:11px}
.wchip .wn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip.done .wn{text-decoration:line-through;opacity:.7}
.wlist .wday{padding:8px 12px;border-bottom:1px solid var(--border)}
.wlist .wday:last-child{border-bottom:0}
.wlist .wday.today{background:color-mix(in srgb,var(--primary) 6%,var(--surface))}
.wday-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;min-height:44px;padding:0 4px;font-weight:500;font-size:15px;color:var(--text);text-align:left;border-radius:8px}
.wday-head:hover{background:var(--surface-2)}
.wday-head .cnt{margin-left:auto;font-size:13px;color:var(--text-2);font-weight:400}

/* ---------- Recurrence editor ---------- */
.rec{border:1px solid var(--border);border-radius:12px;padding:14px 14px 4px;background:var(--bg)}
.wd-chips{display:flex;gap:4px;flex-wrap:wrap}
.wd-chip{min-width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;padding:0 8px}
.wd-chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:2px;padding:0 0 0 12px;min-height:44px;border-radius:22px;background:var(--surface-3);font-size:14px}
.tag .icon-btn{width:40px;height:40px}
.add-skip{display:flex;gap:8px;flex-wrap:wrap}
.add-skip .input{flex:1 1 160px;width:auto}
.rec-preview{font-size:14px;background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px}

/* ---------- Workout editor & logger ---------- */
.ex-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--border)}
.ex-row .field{margin-bottom:0}
.ex-nums{display:flex;gap:8px}
.ex-nums .field{width:84px}
.ex-tools{display:flex}
@media (max-width:719px){
  .ex-row{grid-template-columns:1fr}
  .ex-nums .field{flex:1;width:auto}
  .ex-tools{justify-content:flex-end;margin-top:-4px}
}
.ex-preview{list-style:none;margin:6px 0 0;padding:0}
.ex-preview li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.ex-preview li:last-child{border-bottom:0}
.ex-preview .n{overflow-wrap:anywhere}
.ex-preview .d{color:var(--text-2);white-space:nowrap}
.log-ex{border:1px solid var(--border);border-radius:12px;padding:6px 12px 8px;margin-bottom:12px}
.log-ex-head{display:flex;align-items:center;gap:8px;min-height:44px}
.log-ex-head strong{flex:1;font-weight:500;overflow-wrap:anywhere}
.set-head,.set-row{display:grid;grid-template-columns:minmax(96px,1fr) minmax(64px,1fr) minmax(76px,1fr) 44px;gap:8px;align-items:center}
.set-head{font-size:12px;color:var(--text-2);font-weight:500;padding:0 0 2px}
.set-row{min-height:52px}
.set-check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px}
.set-check input{width:22px;height:22px;accent-color:var(--success);margin:0}
.set-row.done .input{background:var(--success-soft)}
.progress-note{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0 12px}

/* ---------- Habits ---------- */
.habit-main{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:4px 0 14px}
.streak{display:flex;align-items:center;gap:6px}
.streak svg{color:#e8710a}
.streak strong{font-size:22px;font-weight:500}
.prog-line{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);margin-bottom:6px}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px;margin-top:14px}
.strip span{aspect-ratio:1;border-radius:3px;background:var(--surface-3);min-height:6px}
.strip .done{background:var(--c-habit)}
.strip .missed{background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger)}
.strip .today{box-shadow:inset 0 0 0 2px var(--c-habit)}
.strip .off{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.strip-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-top:4px}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:8px}
.key span{display:inline-flex;align-items:center;gap:4px}
.key i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---------- Tables ---------- */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
.table th{color:var(--text-2);font-weight:500}
.table td.num,.table th.num{text-align:right}
.list-row{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--border);padding:4px 0}
.list-row:last-child{border-bottom:0}
.list-row .t{flex:1;min-width:0}
.lib{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Banners ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--warn-soft);margin-bottom:16px}
.banner svg{color:var(--warn);margin-top:1px}
.banner .t{flex:1}
.banner.info{background:var(--primary-soft)}
.banner.info svg{color:var(--primary-text)}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--primary-soft);color:var(--text);margin-bottom:14px;font-size:14px}
.note svg{color:var(--primary-text)}

/* ---------- Modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s}
.modal{position:relative;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-3);width:100%;max-width:560px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;animation:pop .18s ease}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 10px 6px 24px}
.modal-head h2{flex:1;font-size:20px;overflow-wrap:anywhere}
.modal-body{padding:8px 24px 12px;overflow:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 16px 16px;flex-wrap:wrap;border-top:1px solid var(--border)}
.modal-foot .left{margin-right:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@media (max-width:599px){
  .modal-wrap{padding:0;align-items:flex-end}
  .modal{max-width:none!important;border-radius:20px 20px 0 0;max-height:94vh;max-height:94dvh}
  .modal-body{padding:8px 16px 12px}
  .modal-head{padding-left:16px}
  .modal-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
.detail-list{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:4px 0 12px;font-size:14px}
.detail-list dt{color:var(--text-2)}
.detail-list dd{margin:0;overflow-wrap:anywhere}

/* ---------- Snackbar ---------- */
#snackbar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,180%);background:#303134;color:#f1f3f4;border-radius:8px;padding:6px 8px 6px 16px;min-height:48px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-3);z-index:200;transition:transform .2s ease;max-width:calc(100vw - 32px);font-size:14px}
#snackbar.show{transform:translate(-50%,0)}
#snackbar button{background:transparent;border:0;color:#8ab4f8;font-weight:600;min-height:44px;padding:0 12px;cursor:pointer;border-radius:6px}
@media (max-width:599px){ #snackbar{bottom:calc(76px + env(safe-area-inset-bottom))} }

/* ---------- Recovery ---------- */
.recovery{max-width:620px;margin:40px auto}
.recovery pre{max-height:160px;overflow:auto;background:var(--surface-2);padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}

/* ---------- Colour layer (Google-style tints) ---------- */
.type-cal{--c:var(--c-cal)} .type-dash{--c:var(--c-dash)}
.brand-mark{background:linear-gradient(135deg,#4285f4 0%,#a142f4 100%);color:#fff}
.card{border:1px solid var(--card-border);border-radius:20px;background:var(--card-bg);--surface-2:var(--card-s2);--surface-3:var(--card-s3)}
.cal-wrap{border:1px solid var(--card-border);background:var(--card-bg)}
.card,.cal-wrap{box-shadow:var(--card-shadow)}
.card{transition:transform .15s,box-shadow .15s}
@media (hover:hover){ .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)} }
@media (prefers-reduced-motion:reduce){ .card,.tile{transition:none} .card:hover,.tile:hover{transform:none} }
/* Dashboard: rearrange cards */
.dash-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 8px}
.dash-bar.arranging-bar{justify-content:flex-start;flex-wrap:wrap;padding:8px 8px 8px 16px;border-radius:16px;background:var(--primary-soft);color:var(--text);font-size:14px}
.dash-bar.arranging-bar>svg{color:var(--primary);flex:none}
.dash-bar.arranging-bar .t{flex:1;min-width:180px}
.arranging>.card{outline:2px dashed color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:-2px;cursor:grab;user-select:none;-webkit-user-select:none}
.arranging>.card>:not(.arr-bar){pointer-events:none;opacity:.55}
.arranging>.card:hover{transform:none}
.arranging>.card.dragging{opacity:.6;cursor:grabbing;box-shadow:var(--shadow-3);outline-style:solid}
.arr-bar{display:flex;align-items:center;gap:4px;margin:-6px -8px 10px -6px;padding:2px 2px 2px 4px;border-radius:12px;background:var(--surface-2)}
.arr-handle{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--text-2);cursor:grab;touch-action:none;flex:none}
.arr-handle:hover{background:var(--surface-3)}
.arranging>.card.dash-off{outline-color:var(--border);box-shadow:none;background:transparent}
.arranging>.card.dash-off>:not(.arr-bar){display:none}
.arranging>.card.dash-off .arr-bar{margin-bottom:-6px}
.arranging>.card.dash-off .arr-name{color:var(--text-2);font-weight:500}
.add-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.add-kind{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;text-align:left}
.add-kind:hover,.add-kind:focus-visible{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:var(--c)}
.add-kind .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
/* ---------- Notes ---------- */
.notes{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.notes{grid-template-columns:1fr}}
.note-list{padding:8px}
.note-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer;color:var(--text)}
.note-item:hover{background:var(--surface-2)}
.note-item.active{background:color-mix(in srgb,var(--c-note) 16%,var(--card-bg))}
.note-item .name{font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .meta{font-size:12px;color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-ed{display:flex;flex-direction:column;gap:10px}
.ne-top{display:flex;align-items:center;gap:8px}
.ne-title{flex:1;min-width:0;border:0;background:none;font:500 22px/1.3 Arial,Helvetica,sans-serif;color:var(--text);padding:6px 4px;border-radius:8px}
.ne-title:focus{outline:2px solid var(--primary);outline-offset:0}
.ne-tools{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--surface-2)}
.ne-tools .sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.ne-btn{min-width:36px;height:36px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--text);cursor:pointer;display:inline-grid;place-items:center;font:16px Arial,Helvetica,sans-serif}
.ne-btn:hover{background:var(--surface-3)}
.ne-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--c-note) 25%,var(--card-bg));color:var(--text)}
.ne-btn svg.i{width:20px;height:20px}
.ne-size{height:36px;width:auto;padding:0 8px;font-size:14px}
.ne-body{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;min-height:45vh;padding:12px 8px;border-radius:8px;outline:none;overflow-wrap:anywhere;color:var(--text)}
.ne-body:focus{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c-note) 45%,transparent)}
.ne-body:empty::before{content:attr(data-ph);color:var(--text-2)}
.ne-body ul,.ne-body ol{margin:4px 0;padding-left:28px}
.ne-saved{font-size:12px;color:var(--text-2);margin:0}
.arr-name{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title .ic{background:var(--surface-2);background:color-mix(in srgb,var(--c,var(--primary)) 16%,var(--surface));color:var(--c,var(--primary))}
.card[class*="type-"] .badge:not(.ok):not(.type){background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--text))}
.card[class*="type-"] .check-hit input{accent-color:var(--c)}
.card[class*="type-"] .bar>span{background:var(--c)}
.card[class*="type-"] .bar.full>span{background:var(--c-savings)}
.bar.under>span,.card[class*="type-"] .bar.under>span{background:var(--c-savings)}
.bar.over>span,.card[class*="type-"] .bar.over>span{background:var(--danger)}
.over-text{color:var(--danger);font-weight:500}
.exp-total{display:flex;justify-content:space-between;gap:8px;padding:10px 0 0;margin-top:6px;border-top:1px solid var(--border);font-weight:500}
.nav-item svg{color:var(--c,var(--text-2))}
.nav-item[aria-current="page"]{background:var(--primary-soft);background:color-mix(in srgb,var(--c,var(--primary)) 16%,var(--drawer-bg));color:var(--text)}
.nav-item[aria-current="page"] svg{color:var(--c,var(--primary))}
.bottombar a svg{color:var(--c,var(--text-2))}
.bottombar [aria-current="page"]{color:var(--text)}
.bottombar [aria-current="page"] svg{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.page-head h1{display:flex;align-items:center;gap:12px}
.h-ic{width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;flex:none;background:var(--surface-2);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}

/* Greeting header */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-radius:24px;padding:24px 28px;margin:4px 0 16px;border:1px solid var(--card-border);
  background:var(--primary-soft);background:linear-gradient(115deg,color-mix(in srgb,#a142f4 20%,var(--surface)) 0%,color-mix(in srgb,#4285f4 18%,var(--surface)) 50%,color-mix(in srgb,#34a853 16%,var(--surface)) 100%)}
.hero-text{flex:1 1 260px;min-width:0}
.hero h1{font-size:32px;font-weight:500;line-height:1.15;overflow-wrap:anywhere}
.hero-date{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin-bottom:6px}
.hero .summary{margin-top:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;--c:var(--primary)}
.ring .rv{position:relative;width:96px;height:96px}
.ring .rv svg{width:96px;height:96px;display:block}
.ring .rv span{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:600}
.ring .trk{stroke:var(--surface-3);stroke:color-mix(in srgb,var(--c) 20%,transparent)}
.ring .val{stroke:var(--c);transition:stroke-dashoffset .4s}
.ring small{font-size:12px;color:var(--text-2)}
@media (max-width:599px){ .hero{padding:18px 18px} .hero h1{font-size:26px} .ring .rv,.ring .rv svg{width:80px;height:80px} }

/* Packed card columns (no gaps under short cards) */
.grid.masonry{display:block;columns:280px;column-gap:16px}
.grid.masonry>*{break-inside:avoid;margin-bottom:16px;display:block;width:100%}
.grid.masonry>.card{display:block}

/* Stat tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));margin-bottom:16px}
.tile{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--text);border-radius:18px;padding:14px 16px;min-height:104px;
  background:var(--surface-2);background:color-mix(in srgb,var(--c) 17%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 24%,transparent);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.tile .tl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--c) 65%,var(--text))}
.tile .tv{font-size:28px;font-weight:500;line-height:1.2;margin-top:auto}
.tile .ts{font-size:12px;color:var(--text-2)}

/* Mini calendar */
.mini-head{display:flex;align-items:center;gap:4px;margin:-4px 0 4px}
.mini-head .ttl{flex:1;text-align:center;font-weight:500}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.mini .dh{font-size:11px;color:var(--text-2);font-weight:600;padding:2px 0 4px}
.mini button{min-height:44px;border:0;background:transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--text);padding:0}
.mini button:hover{background:var(--surface-2)}
.mini button.other{opacity:.45}
.mini .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.mini button.today .n{background:var(--c-cal);color:var(--on-danger);font-weight:600}
.mini .dots{display:flex;gap:2px;height:5px}
.mini .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.mini-key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:10px}
.mini-key span{display:inline-flex;align-items:center;gap:5px}
.mini-key i{width:8px;height:8px;border-radius:50%;background:var(--c)}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" type="button" data-act="openDrawer" aria-label="Open menu" aria-controls="drawer" aria-expanded="false"></button>
  <div class="brand"><span class="brand-mark" id="brandMark"></span><span class="brand-name" id="brandName"></span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" type="button" data-act="toggleTheme" aria-label="Switch to dark mode"></button>
</header>
<div class="layout">
  <nav class="drawer" id="drawer" aria-label="Main"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<nav class="bottombar" id="bottombar" aria-label="Quick"></nav>
<div id="modal-root"></div>
<div id="snackbar" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden data-chg="importFile">

<script>
'use strict';
/* ===========================================================================
   1. CONFIG
   =========================================================================== */
const APP_NAME = 'DayTrak';
const APP_VERSION = '1.1.0';
const STORAGE_KEY = 'daytrak_v1';
const LEGACY_KEYS = ['slt_v1'];
const SCHEMA_VERSION = 2;
const CATEGORIES = ['Full Body','Push','Pull','Legs','Shoulders','Back','Arms','Chest','Glutes','Upper','Lower'];
const HORIZONS = [
  {id:'today', label:'Today'}, {id:'week', label:'This week'},
  {id:'month', label:'This month'}, {id:'year', label:'This year'}];
const TIMINGS = [
  {id:'morning', label:'Morning', time:'08:00'}, {id:'night', label:'Night', time:'21:00'},
  {id:'anytime', label:'Anytime', time:''}];
const TYPES = {occasion:'Important date', workout:'Workout', supplement:'BioStack', savings:'Savings', expense:'Expense', task:'Task', habit:'Habit'};
const TYPE_ORDER = ['occasion','workout','task','savings','expense','supplement','habit'];
const DASH_CARDS = ['tasks','workout','calendar','dates','supplements','habits','savings','expenses','notes','upcoming']; // default dashboard card order
const WEEKDAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WD_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const KG_PER_LB = 0.45359237;
const ROUTES = [
  {id:'dashboard', label:'Dashboard', icon:'dashboard', color:'var(--c-dash)'},
  {id:'calendar', label:'Calendar', icon:'calendar', color:'var(--c-cal)'},
  {id:'workouts', label:'Workouts', icon:'workout', color:'var(--c-workout)'},
  {id:'supplements', label:'BioStack', icon:'supplement', color:'var(--c-supplement)'},
  {id:'savings', label:'Savings', icon:'savings', color:'var(--c-savings)'},
  {id:'expenses', label:'Expenses', icon:'expense', color:'var(--c-expense)'},
  {id:'tasks', label:'Tasks', icon:'task', color:'var(--c-task)'},
  {id:'habits', label:'Habits', icon:'habit', color:'var(--c-habit)'},

/* ===========================================================================
   2. UTILITIES (pure helpers, dates, formatting)
   =========================================================================== */
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const arr = v => Array.isArray(v) ? v : [];
const clone = v => JSON.parse(JSON.stringify(v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = (sel, root) => (root || document).querySelector(sel);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clampInt(v, min, max, def){ const n = typeof v === 'number' ? v : (typeof v === 'string' && /^\s*-?\d+\s*$/.test(v) ? parseInt(v, 10) : NaN); return Number.isInteger(n) && n >= min && n <= max ? n : def; }
function clampNum(v, min, max, def){ const n = typeof v === 'number' ? v : (typeof v === 'string' ? parseFloat(v) : NaN); return Number.isFinite(n) && n >= min && n <= max ? n : def; }
function str(v, max, def){ return typeof v === 'string' ? v.trim().slice(0, max) : (def || ''); }
function oneOf(v, list, def){ return list.includes(v) ? v : def; }
function validTime(v){ return typeof v === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : ''; }
function round1(n){ return Math.round(n * 10) / 10; }
function round2(n){ return Math.round(n * 100) / 100; }
function plural(n, one, many){ return `${n} ${n === 1 ? one : (many || one + 's')}`; }
function ordinal(n){ const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function parseWhole(v){ const t = String(v).trim(); return /^\d+$/.test(t) ? parseInt(t, 10) : NaN; }
function parseAmount(v){ const t = String(v).trim().replace(/[$,\s]/g, ''); if(!/^\d*\.?\d{0,2}$/.test(t) || t === '' || t === '.') return NaN; return parseFloat(t); }

const DAY_MS = 86400000;
const ISO_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
/* Dates are stored as 'YYYY-MM-DD' strings and computed as whole UTC day numbers (no DST issues). */
const Dates = {
  isValid(s){
    if(typeof s !== 'string') return false;
    const m = ISO_RE.exec(s); if(!m) return false;
    const y = +m[1], mo = +m[2], d = +m[3];
    return y >= 1900 && y <= 2200 && mo >= 1 && mo <= 12 && d >= 1 && d <= Dates.dim(y, mo);
  },
  dim(y, m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
  make(y, m, d){ return `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; },
  ymd(s){ const m = ISO_RE.exec(s); return [+m[1], +m[2], +m[3]]; },
  toNum(s){ const [y,m,d] = Dates.ymd(s); return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); },
  fromNum(n){ const t = new Date(n * DAY_MS); return Dates.make(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); },
  add(s, n){ return Dates.fromNum(Dates.toNum(s) + n); },
  diff(a, b){ return Dates.toNum(b) - Dates.toNum(a); },
  dowNum(n){ return ((n + 3) % 7 + 7) % 7; },            /* Monday = 0 (1970-01-01 was a Thursday) */
  dow(s){ return Dates.dowNum(Dates.toNum(s)); },
  weekStart(s){ return Dates.add(s, -Dates.dow(s)); },
  monthStart(s){ return s.slice(0, 8) + '01'; },
  monthEnd(s){ const [y,m] = Dates.ymd(s); return Dates.make(y, m, Dates.dim(y, m)); },
  addMonths(s, k){ const [y,m,d] = Dates.ymd(s); const idx = y * 12 + (m - 1) + k; const ny = Math.floor(idx / 12), nm = idx - ny * 12 + 1; return Dates.make(ny, nm, Math.min(d, Dates.dim(ny, nm))); },
  today(){ const t = new Date(); return Dates.make(t.getFullYear(), t.getMonth() + 1, t.getDate()); },
  range(a, b){ const out = []; for(let n = Dates.toNum(a), e = Dates.toNum(b); n <= e; n++) out.push(Dates.fromNum(n)); return out; }
};

function fmtDate(s, style){
  if(!Dates.isValid(s)) return '';
  const o = {timeZone:'UTC'};
  if(style === 'long') Object.assign(o, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  else if(style === 'short') Object.assign(o, {weekday:'short', month:'short', day:'numeric'});
  else if(style === 'day') Object.assign(o, {weekday:'long', month:'long', day:'numeric'});
  else if(style === 'month') Object.assign(o, {month:'long', year:'numeric'});
  else if(style === 'md') Object.assign(o, {month:'short', day:'numeric'});
  else Object.assign(o, {month:'short', day:'numeric', year:'numeric'});
  try { return new Date(Dates.toNum(s) * DAY_MS).toLocaleDateString(undefined, o); } catch(e){ return s; }
}
function fmtTime(t){
  if(!validTime(t)) return '';
  const [h, m] = t.split(':').map(Number);
  try { return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}); } catch(e){ return t; }
}
function fmtMoney(n){
  const v = Number.isFinite(n) ? n : 0;
  const whole = Math.abs(v - Math.round(v)) < 0.005;
  return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2});
}
function relDay(s, today){
  const d = Dates.diff(today, s);
  if(d === 0) return 'Today'; if(d === 1) return 'Tomorrow'; if(d === -1) return 'Yesterday';
  return fmtDate(s, 'short');
}

/* ===========================================================================
   3. RECURRENCE ENGINE (pure functions — no DOM, no global state)
   A rule: { freq:'none'|'day'|'week'|'month', interval:1-365, weekdays:[0-6 Mon..Sun],
             monthDay:1-31|'last', start:'YYYY-MM-DD', endType:'never'|'date'|'count',
             endDate, count, exceptions:[dates to skip], extra:[one-off moved dates] }
   Occurrences are expanded on the fly; nothing future is stored.
   =========================================================================== */
const Recurrence = {
  FREQS: ['none','day','week','month'],
  create(start){
    return {freq:'none', interval:1, weekdays:[Dates.dow(start)], monthDay:Dates.ymd(start)[2], start,
            endType:'never', endDate:'', count:10, exceptions:[], extra:[]};
  },
  normalize(r, fallbackStart){
    const o = isObj(r) ? r : {};
    const start = Dates.isValid(o.start) ? o.start : fallbackStart;
    const out = Recurrence.create(start);
    out.freq = oneOf(o.freq, Recurrence.FREQS, 'none');
    out.interval = clampInt(o.interval, 1, 365, 1);
    const wd = arr(o.weekdays).filter(x => Number.isInteger(x) && x >= 0 && x <= 6);
    out.weekdays = wd.length ? [...new Set(wd)].sort((a,b) => a - b) : [Dates.dow(start)];
    out.monthDay = o.monthDay === 'last' ? 'last' : clampInt(o.monthDay, 1, 31, out.monthDay);
    out.endType = oneOf(o.endType, ['never','date','count'], 'never');
    out.endDate = Dates.isValid(o.endDate) ? o.endDate : '';
    if(out.endType === 'date' && !out.endDate) out.endType = 'never';
    out.count = clampInt(o.count, 1, 999, 10);
    out.exceptions = [...new Set(arr(o.exceptions).filter(Dates.isValid))].sort();
    out.extra = [...new Set(arr(o.extra).filter(Dates.isValid))].sort();
    return out;
  },
  validate(r){
    if(!r || !Dates.isValid(r.start)) return 'Pick a valid date.';
    if(r.freq !== 'none'){
      if(!Number.isInteger(r.interval) || r.interval < 1 || r.interval > 365) return '"Repeat every" must be a whole number from 1 to 365.';
      if(r.freq === 'week' && !(r.weekdays && r.weekdays.length)) return 'Pick at least one day of the week.';
      if(r.freq === 'month' && !(r.monthDay === 'last' || (Number.isInteger(r.monthDay) && r.monthDay >= 1 && r.monthDay <= 31))) return 'Pick a day of the month.';
      if(r.endType === 'date'){
        if(!Dates.isValid(r.endDate)) return 'Pick an end date.';
        if(r.endDate < r.start) return 'The end date must be on or after the start date.';
      }
      if(r.endType === 'count' && (!Number.isInteger(r.count) || r.count < 1 || r.count > 999)) return '"End after" must be a whole number from 1 to 999.';
    }
    return '';
  },
  isRepeating(r){ return !!r && r.freq !== 'none'; },
  /* Returns a fast predicate on day numbers for the repeating pattern (ignores end/exceptions). */
  matcher(r){
    const s0 = Dates.toNum(r.start), iv = r.interval;
    if(r.freq === 'day') return n => (n - s0) % iv === 0;
    if(r.freq === 'week'){
      const w0 = s0 - Dates.dowNum(s0); const set = new Set(r.weekdays);
      return n => { const dw = Dates.dowNum(n); return set.has(dw) && ((n - dw - w0) / 7) % iv === 0; };
    }
    if(r.freq === 'month'){
      const [y0, m0] = Dates.ymd(r.start); const i0 = y0 * 12 + m0 - 1;
      return n => {
        const t = new Date(n * DAY_MS); const y = t.getUTCFullYear(), m = t.getUTCMonth(), d = t.getUTCDate();
        if(((y * 12 + m) - i0) % iv !== 0) return false;
        if(r.monthDay === 'last') return d === new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
        return d === r.monthDay;
      };
    }
    return n => n === s0;
  },
  /* All occurrence dates in [from, to], sorted. limit>0 stops after that many. */
  expand(r, from, to, limit){
    if(!r || !Dates.isValid(r.start) || !ISO_RE.test(from) || !ISO_RE.test(to) || from > to) return [];
    const ex = new Set(r.exceptions || []);
    const fromN = Dates.toNum(from); let endN = Dates.toNum(to);
    const s0 = Dates.toNum(r.start);
    const out = [];
    if(r.freq === 'none'){
      if(s0 >= fromN && s0 <= endN && !ex.has(r.start)) out.push(r.start);
    } else {
      if(r.endType === 'date' && Dates.isValid(r.endDate)) endN = Math.min(endN, Dates.toNum(r.endDate));
      const counting = r.endType === 'count';
      const match = Recurrence.matcher(r);
      let seen = 0;
      const MAX_STEPS = 366 * 60;
      for(let n = counting ? s0 : Math.max(s0, fromN), steps = 0; n <= endN && steps < MAX_STEPS; n++, steps++){
        if(!match(n)) continue;
        if(counting && ++seen > r.count) break;
        if(n < fromN) continue;
        const s = Dates.fromNum(n);
        if(ex.has(s)) continue;
        out.push(s);
        if(limit && out.length >= limit) break;
      }
    }
    for(const e of (r.extra || [])) if(e >= from && e <= to && !ex.has(e) && !out.includes(e)) out.push(e);
    out.sort();
    return limit ? out.slice(0, limit) : out;
  },
  occursOn(r, s){ return Recurrence.expand(r, s, s).length > 0; },
  next(r, from, n){ return Recurrence.expand(r, from, Dates.add(from, 366 * 30), n); },
  /* Move one occurrence to a new date (returns a new rule). */
  moveOccurrence(r, from, to){
    const out = clone(r);
    if(out.freq === 'none' && out.start === from && !out.extra.includes(from)){ out.start = to; return out; }
    if(out.extra.includes(from)) out.extra = out.extra.filter(x => x !== from);
    else if(!out.exceptions.includes(from)) out.exceptions.push(from);
    out.exceptions = out.exceptions.filter(x => x !== to).sort();
    if(!Recurrence.occursOn(out, to)) out.extra = [...out.extra, to].sort();
    return out;
  },
  /* Skip one occurrence (returns a new rule). */
  skip(r, date){
    const out = clone(r);
    if(out.extra.includes(date)) out.extra = out.extra.filter(x => x !== date);
    else if(!out.exceptions.includes(date)) out.exceptions = [...out.exceptions, date].sort();
    return out;
  },
  describe(r){
    if(!r) return '';
    const n = r.interval;
    let s;
    if(r.freq === 'none') return 'Once, ' + fmtDate(r.start, 'short');
    if(r.freq === 'day') s = n === 1 ? 'Every day' : `Every ${n} days`;
    else if(r.freq === 'week'){
      const wd = r.weekdays;
      const days = wd.length === 7 ? 'every day' : (wd.join() === '0,1,2,3,4' ? 'weekdays' : (wd.join() === '5,6' ? 'weekends' : wd.map(i => WD_SHORT[i]).join(', ')));
      s = (n === 1 ? 'Weekly' : `Every ${n} weeks`) + ' on ' + days;
    } else s = (n === 1 ? 'Monthly' : `Every ${n} months`) + ' on the ' + (r.monthDay === 'last' ? 'last day' : ordinal(r.monthDay));
    if(r.endType === 'date') s += `, until ${fmtDate(r.endDate, 'md')}`;
    else if(r.endType === 'count') s += `, ${plural(r.count, 'time')}`;
    if(r.exceptions.length) s += ` (${r.exceptions.length} skipped)`;
    return s;
  }
};

/* ===========================================================================
   4. HABIT STREAK LOGIC (pure functions — take the habit and "today")
   =========================================================================== */
const HabitLogic = {
  isDue(h, s){
    if(s < h.start) return false;
    return h.freq === 'custom' ? Recurrence.occursOn(h.recurrence, s) : true;
  },
  dueDays(h, a, b){
    if(a < h.start) a = h.start;
    if(a > b) return [];
    return h.freq === 'custom' ? Recurrence.expand(h.recurrence, a, b) : Dates.range(a, b);
  },
  periodStart(h, s){ return h.freq === 'weekly' ? Dates.weekStart(s) : Dates.monthStart(s); },
  periodEnd(h, p){ return h.freq === 'weekly' ? Dates.add(p, 6) : Dates.monthEnd(p); },
  nextPeriod(h, p){ return h.freq === 'weekly' ? Dates.add(p, 7) : Dates.addMonths(p, 1); },
  countIn(h, a, b){ let c = 0; for(const k in h.checks) if(k >= a && k <= b) c++; return c; },
  /* Daily/custom: consecutive due days done. Weekly/monthly: consecutive periods meeting the target.
     Today (or the current period) never breaks a streak until it is over. */
  streaks(h, today){
    if(h.freq === 'daily' || h.freq === 'custom'){
      const days = HabitLogic.dueDays(h, h.start, today);
      let run = 0, longest = 0;
      for(const d of days){
        if(h.checks[d]){ run++; if(run > longest) longest = run; }
        else if(d !== today) run = 0;
      }
      let current = 0;
      for(let i = days.length - 1; i >= 0; i--){
        if(h.checks[days[i]]) current++;
        else if(days[i] === today) continue;
        else break;
      }
      return {current, longest, unit: h.freq === 'daily' ? 'day' : 'time'};
    }
    const counts = {};
    for(const k in h.checks){ const p = HabitLogic.periodStart(h, k); counts[p] = (counts[p] || 0) + 1; }
    const last = HabitLogic.periodStart(h, today);
    const periods = [];
    for(let p = HabitLogic.periodStart(h, h.start), g = 0; p <= last && g < 6000; p = HabitLogic.nextPeriod(h, p), g++) periods.push(p);
    let run = 0, longest = 0;
    for(const p of periods){
      if((counts[p] || 0) >= h.target){ run++; if(run > longest) longest = run; }
      else if(p !== last) run = 0;
    }
    let current = 0;
    for(let i = periods.length - 1; i >= 0; i--){
      if((counts[periods[i]] || 0) >= h.target) current++;
      else if(periods[i] === last) continue;
      else break;
    }
    return {current, longest, unit: h.freq === 'weekly' ? 'week' : 'month'};
  },
  /* Completion for the current week (daily/custom/weekly) or month (monthly). */
  progress(h, today){
    if(h.freq === 'weekly' || h.freq === 'monthly'){
      const p = HabitLogic.periodStart(h, today);
      const done = HabitLogic.countIn(h, p, HabitLogic.periodEnd(h, p));
      return {label: h.freq === 'weekly' ? 'This week' : 'This month', done, total: h.target, pct: Math.min(100, Math.round(done / h.target * 100))};
    }
    const ws = Dates.weekStart(today);
    const due = HabitLogic.dueDays(h, ws, Dates.add(ws, 6));
    const done = due.filter(d => h.checks[d]).length;
    return {label:'This week', done, total: due.length, pct: due.length ? Math.round(done / due.length * 100) : 0};
  },
  /* Last n days, oldest first: done | missed | today | open | off */
  strip(h, today, n){
    const out = [];
    for(let i = n - 1; i >= 0; i--){
      const d = Dates.add(today, -i);
      let st;
      if(h.checks[d]) st = 'done';
      else if(d < h.start) st = 'off';
      else if(h.freq === 'daily' || h.freq === 'custom'){
        if(!HabitLogic.isDue(h, d)) st = 'off';
        else st = d === today ? 'today' : 'missed';
      } else st = d === today ? 'today' : 'open';
      out.push({date:d, status:st});
    }
    return out;
  }
};

function emptyState(){

const idOf = v => (typeof v === 'string' && /^[\w-]{1,40}$/.test(v)) ? v : uid();

function normExpense(o){

/* Notes keep a small whitelist of formatting tags; everything else is unwrapped or dropped. */
function sanitizeNoteHtml(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const KEEP = new Set(['B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','P','DIV','BR','FONT']);
  const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','META','LINK','svg','SVG','MATH','IMG','PICTURE','VIDEO','AUDIO','INPUT','TEXTAREA','SELECT','BUTTON','FORM','NOSCRIPT']);
  const walk = node => {
    for(const c of [...node.childNodes]){
      if(c.nodeType === 3) continue;
      if(c.nodeType !== 1 || DROP.has(c.nodeName)){ c.remove(); continue; }
      walk(c);
      if(!KEEP.has(c.nodeName)){ c.replaceWith(...c.childNodes); continue; }
      const size = c.nodeName === 'FONT' ? c.getAttribute('size') : null;
      for(const a of [...c.attributes]) c.removeAttribute(a.name);
      if(c.nodeName === 'FONT'){ if(/^[1-7]$/.test(size || '')) c.setAttribute('size', size); else c.replaceWith(...c.childNodes); }
    }
  };
  walk(tpl.content);
  const d = document.createElement('div'); d.appendChild(tpl.content);
  return d.innerHTML.slice(0, 200000);
}
function normNote(o){
  return {id: idOf(o.id), title: str(o.title, 120), html: sanitizeNoteHtml(o.html), updated: clampNum(o.updated, 0, 1e14, Date.now()), sample: !!o.sample};
}
function normOccasion(o){
  const title = str(o.title, 120); if(!title || !Dates.isValid(o.date)) return null;

function normTask(o, today){

    recurrence: isObj(o.recurrence) ? Recurrence.normalize(o.recurrence, today) : null,
    done: !!o.done, completedAt: Dates.isValid(o.completedAt) ? o.completedAt : '', doneDates: dateMap(o.doneDates), sample: !!o.sample};
}
function normHabit(o, today){
  const name = str(o.name, 80); if(!name) return null;
  const freq = oneOf(o.freq, ['daily','weekly','monthly','custom'], 'daily');
  const h = {id: idOf(o.id), name, freq, target: clampInt(o.target, 1, freq === 'monthly' ? 31 : 7, freq === 'monthly' ? 4 : 3),
    start: Dates.isValid(o.start) ? o.start : today, recurrence: null, checks: dateMap(o.checks), sample: !!o.sample};
  if(freq === 'custom'){ h.recurrence = Recurrence.normalize(o.recurrence, h.start); h.start = h.recurrence.start; }

/* Builds a clean state from any parsed object; bad entries are skipped and counted. */
/* Keeps only known card ids (no duplicates) and appends any missing ones, so new cards always show up. */
function normalizeDashOrder(list){
  const out = [];
  for(const id of arr(list)) if(DASH_CARDS.includes(id) && !out.includes(id)) out.push(id);
  for(const id of DASH_CARDS) if(!out.includes(id)) out.push(id);

}
function normalizeState(d){
  const today = Dates.today();
  const s = emptyState();
  const st = isObj(d.settings) ? d.settings : {};
  s.settings.units = oneOf(st.units, ['metric','imperial'], 'imperial');
  s.settings.theme = oneOf(st.theme, ['system','light','dark'], 'system');
  s.settings.calView = oneOf(st.calView, ['week','month'], 'month');
  s.settings.name = str(st.name, 40);
  s.settings.calHidden = [...new Set(arr(st.calHidden).filter(t => typeof t === 'string' && Object.prototype.hasOwnProperty.call(TYPES, t)))];
  s.settings.dashOrder = normalizeDashOrder(st.dashOrder);
  s.settings.dashHidden = [...new Set(arr(st.dashHidden).filter(id => DASH_CARDS.includes(id) && id !== 'calendar'))];
  s.settings.weekStart = oneOf(st.weekStart, ['mon','sun'], 'mon');

/* Upgrades older saved data step by step. Add a new "if(v < N)" block for each future schema. */
function migrate(d){

  // v2: weights default to pounds. Switch older saves to lb once; the Settings toggle still works afterwards.
  if(v < 2){ d.settings = Object.assign({}, isObj(d.settings) ? d.settings : {}, {units:'imperial'}); v = 2; }
  d.schemaVersion = Math.max(v, SCHEMA_VERSION);
  return d;
}

const Storage = {
  ok: false,
  init(){

    catch(e){ this.ok = false; }
  },
  read(){
    if(!this.ok) return {status:'unavailable'};

    } catch(e){ return {status:'unavailable'}; }
    if(raw == null) return {status:'new'};
    try { return {status:'ok', data: loadData(JSON.parse(raw)), skipped: normalizeSkipped}; }
    catch(e){ return {status:'corrupt', raw}; }
  },
  write(){
    if(!this.ok || ui.recovery) return false;
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch(e){ toast("Couldn't save. Browser storage may be full or blocked — export a backup."); return false; }
  },

};

function convertWeight(v, from, to){ if(from === to) return v; return from === 'kg' ? v / KG_PER_LB : v * KG_PER_LB; }

/* Keeps the original stored weight when the user didn't change the displayed number. */
function readWeight(text, orig){
  const t = String(text).trim().replace(',', '.');
  if(t === '') return {weight:0, unit:displayUnit()};
  if(!/^\d*\.?\d+$/.test(t)) return {error:'Weight must be a number (or leave it empty for bodyweight).'};
  const n = parseFloat(t);

/* ----- Toast ----- */

        <div class="modal-head"><h2 id="mt-${id}"></h2><button type="button" class="icon-btn" data-modal-close aria-label="Close">${icon('close')}</button></div>
        <div class="modal-body">${o.body}</div>
        <div class="modal-foot">${o.footer}</div>
      </div>`;
    const m = {
      id, wrap, el: wrap.querySelector('.modal'), body: wrap.querySelector('.modal-body'), foot: wrap.querySelector('.modal-foot'),
      refresh: null, prevFocus: document.activeElement,
      setTitle(t){ wrap.querySelector('h2').textContent = t; },
      close(){
        const i = Modal.stack.indexOf(m); if(i < 0) return;
        Modal.stack.splice(i, 1); wrap.remove();
        document.body.classList.toggle('modal-open', Modal.stack.length > 0);
        if(o.onClose) o.onClose();
        if(m.prevFocus && document.contains(m.prevFocus) && m.prevFocus.focus) m.prevFocus.focus();
      }
    };
    m.setTitle(o.title);
    m.foot.hidden = !o.footer;
    wrap.addEventListener('click', e => { if(e.target.closest('[data-modal-close]')){ e.preventDefault(); m.close(); } });
    $('#modal-root').appendChild(wrap);
    Modal.stack.push(m);
    document.body.classList.add('modal-open');
    setTimeout(() => {
      if(!document.contains(wrap)) return;
      const f = m.body.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([disabled]),select,textarea')
        || m.foot.querySelector('.btn.primary:not([disabled])') || m.el.querySelector('.modal-head .icon-btn');
      if(f) f.focus();
    }, 30);
    return m;
  },
  top(){ return Modal.stack[Modal.stack.length - 1] || null; },
  refreshAll(){ for(const m of Modal.stack.slice()) if(m.refresh){ try { m.refresh(); } catch(e){ m.close(); } } },
  closeAll(){ for(const m of Modal.stack.slice().reverse()) m.close(); }
};
function setFormError(m, msg, el){
  const box = m.el.querySelector('.form-error');
  m.el.querySelectorAll('[aria-invalid="true"]').forEach(x => x.removeAttribute('aria-invalid'));
  if(box) box.textContent = msg || '';
  if(el){ el.setAttribute('aria-invalid', 'true'); el.focus(); }
  else if(msg && box) box.scrollIntoView({block:'nearest'});
}
function confirmBox(opts){
  const o = Object.assign({title:'Are you sure?', message:'', ok:'OK', cancel:'Cancel', danger:false, typeToConfirm:''}, opts);
  return new Promise(resolve => {
    let settled = false;
    const finish = v => { if(!settled){ settled = true; resolve(v); } };
    const m = Modal.open({
      title: o.title,
      body: `<p>${o.message}</p>${o.typeToConfirm ? `<label class="field" style="margin-top:14px"><span class="field-label">Type ${esc(o.typeToConfirm)} to confirm</span><input class="input" data-confirm-input autocomplete="off" autocapitalize="characters" spellcheck="false"></label>` : ''}`,
      footer: `<button type="button" class="btn text" data-c="no">${esc(o.cancel)}</button><button type="button" class="btn primary ${o.danger ? 'danger' : ''}" data-c="yes" ${o.typeToConfirm ? 'disabled' : ''}>${esc(o.ok)}</button>`,
      onClose: () => finish(false)
    });
    const inp = m.body.querySelector('[data-confirm-input]');
    if(inp) inp.addEventListener('input', () => { m.foot.querySelector('[data-c=yes]').disabled = inp.value.trim() !== o.typeToConfirm; });
    m.foot.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(!b) return; finish(b.dataset.c === 'yes'); m.close(); });
  });
}
/* Several choices; resolves with the chosen id or null. */
function choiceBox(title, message, choices){
  return new Promise(resolve => {
    let settled = false;
    const finish = v => { if(!settled){ settled = true; resolve(v); } };
    const m = Modal.open({
      title, body: `<p>${message}</p>`,
      footer: `<button type="button" class="btn text" data-c="">Cancel</button>` + choices.map(c => `<button type="button" class="btn ${c.primary ? 'primary' : ''} ${c.danger ? 'danger' : ''}" data-c="${esc(c.id)}">${esc(c.label)}</button>`).join(''),
      onClose: () => finish(null)
    });
    m.foot.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(!b) return; finish(b.dataset.c || null); m.close(); });
  });
}
function download(filename, text, type){
  const blob = new Blob([text], {type: type || 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ===========================================================================
   7. RECURRENCE EDITOR (UI component used by every tracker)
   =========================================================================== */
function RecurrenceEditor(host, initial, opts){
  const o = Object.assign({startLabel:'Date', allowNone:true}, opts);
  const r = clone(initial);
  if(!o.allowNone && r.freq === 'none') r.freq = 'day';
  const raw = {interval: String(r.interval), count: String(r.count)};
  const unitWord = () => {
    const n = Number.isInteger(r.interval) ? r.interval : 2;
    return ({day: n === 1 ? 'day' : 'days', week: n === 1 ? 'week' : 'weeks', month: n === 1 ? 'month' : 'months'})[r.freq] || '';
  };
  function html(){
    const opt = (v, l, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${l}</option>`;
    let h = `<div class="rec">
      <div class="row">
        <label class="field"><span class="field-label">${esc(o.startLabel)}</span><input class="input" type="date" data-r="start" value="${esc(r.start)}" required></label>
        <label class="field"><span class="field-label">Repeat</span><select class="input" data-r="freq">
          ${o.allowNone ? opt('none', "Doesn't repeat", r.freq) : ''}${opt('day', 'Every few days', r.freq)}${opt('week', 'Weekly, on chosen days', r.freq)}${opt('month', 'Monthly, on one day', r.freq)}
        </select></label>
      </div>`;
    if(r.freq !== 'none'){
      h += `<div class="row">
        <label class="field"><span class="field-label">Repeat every</span><span class="input-suffix"><input class="input" type="number" inputmode="numeric" min="1" max="365" step="1" data-r="interval" value="${esc(raw.interval)}"><span data-r-unit>${unitWord()}</span></span></label>`;
      if(r.freq === 'month'){
        h += `<label class="field"><span class="field-label">On day</span><select class="input" data-r="monthDay">`;
        for(let i = 1; i <= 31; i++) h += opt(i, ordinal(i), r.monthDay);
        h += opt('last', 'Last day of the month', r.monthDay) + `</select></label>`;
      }
      h += `</div>`;
      if(r.freq === 'week'){
        h += `<div class="field"><span class="field-label" id="wdl-${host.dataset.rid}">On these days</span><div class="wd-chips" role="group" aria-labelledby="wdl-${host.dataset.rid}">` +
          WEEKDAYS.map((w, i) => `<button type="button" class="wd-chip" data-r-wd="${i}" aria-pressed="${r.weekdays.includes(i)}" aria-label="${w}">${w.slice(0, 2)}</button>`).join('') + `</div></div>`;
      }
      h += `<div class="row">
        <label class="field"><span class="field-label">Ends</span><select class="input" data-r="endType">${opt('never', 'Never', r.endType)}${opt('date', 'On a date', r.endType)}${opt('count', 'After a number of times', r.endType)}</select></label>`;
      if(r.endType === 'date') h += `<label class="field"><span class="field-label">End date</span><input class="input" type="date" data-r="endDate" value="${esc(r.endDate)}"></label>`;
      if(r.endType === 'count') h += `<label class="field"><span class="field-label">End after</span><span class="input-suffix"><input class="input" type="number" inputmode="numeric" min="1" max="999" data-r="count" value="${esc(raw.count)}"><span>times</span></span></label>`;
      h += `</div>
        <div class="field"><span class="field-label">Skip these dates</span>
          ${r.exceptions.length ? `<div class="tags">${r.exceptions.map(d => `<span class="tag">${esc(fmtDate(d))}<button type="button" class="icon-btn" data-r-rm="${d}" aria-label="Stop skipping ${esc(fmtDate(d, 'long'))}">${icon('close', 'sm')}</button></span>`).join('')}</div>` : ''}
          <div class="add-skip"><input class="input" type="date" data-r-skip aria-label="Date to skip"><button type="button" class="btn" data-r-add>Skip date</button></div>
        </div>`;
    }
    h += `<div class="rec-preview" aria-live="polite"></div></div>`;
    return h;
  }
  function read(){
    const q = s => host.querySelector(s);
    const st = q('[data-r=start]'); if(st) r.start = st.value;
    const f = q('[data-r=freq]'); if(f) r.freq = f.value;
    const n = q('[data-r=interval]'); if(n){ raw.interval = n.value; r.interval = parseWhole(n.value); }
    const md = q('[data-r=monthDay]'); if(md) r.monthDay = md.value === 'last' ? 'last' : parseInt(md.value, 10);
    const et = q('[data-r=endType]'); if(et) r.endType = et.value;
    const ed = q('[data-r=endDate]'); if(ed) r.endDate = ed.value;
    const c = q('[data-r=count]'); if(c){ raw.count = c.value; r.count = parseWhole(c.value); }
  }
  function preview(){
    const p = host.querySelector('.rec-preview'); if(!p) return;
    const u = host.querySelector('[data-r-unit]'); if(u) u.textContent = unitWord();
    const err = Recurrence.validate(r);
    if(err){ p.innerHTML = `<span class="field-error">${esc(err)}</span>`; return; }
    if(r.freq === 'none'){ p.innerHTML = `<strong>Happens once:</strong> ${esc(fmtDate(r.start, 'long'))}`; return; }
    const today = Dates.today();
    const next = Recurrence.next(Recurrence.normalize(r, r.start), r.start > today ? r.start : today, 5);
    p.innerHTML = next.length
      ? `<strong>Next ${next.length === 1 ? 'date' : next.length + ' dates'}:</strong> ${next.map(d => esc(fmtDate(d, 'short'))).join(' · ')}`
      : 'No upcoming dates with these settings.';
  }
  function render(focusSel){
    host.innerHTML = html(); preview();
    if(focusSel){ const f = host.querySelector(focusSel); if(f) f.focus(); }
  }
  host.dataset.rid = uid();
  host.addEventListener('change', e => {
    const k = e.target.dataset.r;
    if(k === 'freq' || k === 'endType'){
      read();
      if(k === 'freq' && Dates.isValid(r.start)){
        if(r.freq === 'week' && !r.weekdays.length) r.weekdays = [Dates.dow(r.start)];
        if(r.freq === 'month' && r.monthDay !== 'last' && !Number.isInteger(r.monthDay)) r.monthDay = Dates.ymd(r.start)[2];
      }
      if(k === 'endType' && r.endType === 'date' && !Dates.isValid(r.endDate) && Dates.isValid(r.start)) r.endDate = Dates.addMonths(r.start, 3);
      render(`[data-r=${k}]`);
    } else { read(); preview(); }
  });
  host.addEventListener('input', () => { read(); preview(); });
  host.addEventListener('click', e => {
    const wd = e.target.closest('[data-r-wd]');
    if(wd){
      const i = +wd.dataset.rWd;
      r.weekdays = r.weekdays.includes(i) ? r.weekdays.filter(x => x !== i) : [...r.weekdays, i].sort((a,b) => a - b);
      wd.setAttribute('aria-pressed', String(r.weekdays.includes(i)));
      read(); preview(); return;
    }
    if(e.target.closest('[data-r-add]')){
      const inp = host.querySelector('[data-r-skip]');
      if(!Dates.isValid(inp.value)){ inp.setAttribute('aria-invalid', 'true'); inp.focus(); return; }
      read();
      if(!r.exceptions.includes(inp.value)) r.exceptions = [...r.exceptions, inp.value].sort();
      render('[data-r-skip]'); return;
    }
    const rm = e.target.closest('[data-r-rm]');
    if(rm){ read(); r.exceptions = r.exceptions.filter(d => d !== rm.dataset.rRm); render('[data-r-skip]'); }
  });
  render();
  return {
    read(){ read(); const error = Recurrence.validate(r); return {error, value: error ? null : Recurrence.normalize(clone(r), r.start)}; }
  };
}

/* ===========================================================================
   8. CALENDAR ITEMS — every tracker feeds this one list
   =========================================================================== */
function timingTime(s){ return s.time || (TIMINGS.find(t => t.id === s.timing) || {}).time || ''; }
function taskIsRepeating(t){ return !!t.recurrence && Recurrence.isRepeating(t.recurrence); }
function taskDoneOn(t, d){ return taskIsRepeating(t) ? !!t.doneDates[d] : t.done; }
/* The occurrence a repeating task's checkbox refers to: the latest one up to today, else the next one. */
function taskCurrentDate(t, today){
  if(!t.recurrence) return null;
  if(!taskIsRepeating(t)) return t.recurrence.start;
  const past = Recurrence.expand(t.recurrence, Dates.add(today, -800), today);
  if(past.length) return past[past.length - 1];
  return Recurrence.next(t.recurrence, today, 1)[0] || t.recurrence.start;
}
function taskIsDone(t, today){ return taskIsRepeating(t) ? !!t.doneDates[taskCurrentDate(t, today)] : t.done; }
function setTaskDoneOn(t, d, val, today){
  if(taskIsRepeating(t)){ if(val) t.doneDates[d] = true; else delete t.doneDates[d]; }
  else { t.done = val; t.completedAt = val ? today : ''; }
}
function goalTotal(g){ return round2(g.contributions.reduce((s, c) => s + c.amount, 0)); }

/* Dates an important date lands on between from and to. Yearly ones repeat on the same day each year (Feb 29 → Feb 28). */
function occasionYearDate(o, y){ const [, m, d] = Dates.ymd(o.date); return Dates.make(y, m, Math.min(d, Dates.dim(y, m))); }
function occasionDates(o, from, to){
  if(!o.yearly) return o.date >= from && o.date <= to ? [o.date] : [];
  const out = [], y0 = Math.max(Dates.ymd(from)[0], Dates.ymd(o.date)[0]);
  for(let y = y0; y <= Dates.ymd(to)[0]; y++){ const d = occasionYearDate(o, y); if(d >= from && d <= to) out.push(d); }
  return out;
}
function occasionNext(o, today){
  if(!o.yearly) return o.date;
  const y = Dates.ymd(today)[0];
  let d = occasionYearDate(o, Math.max(y, Dates.ymd(o.date)[0]));
  if(d < today) d = occasionYearDate(o, y + 1);
  return d;
}
function occasionYears(o, d){ const n = Dates.ymd(d)[0] - Dates.ymd(o.date)[0]; return o.yearly && n > 0 ? plural(n, 'year') : ''; }
function collectItems(from, to){
  const today = Dates.today();
  const out = [];
  for(const o of state.occasions)
    for(const d of occasionDates(o, from, to))
      out.push({type:'occasion', kind:'occasion', id:o.id, x:'', date:d, time:'', title:o.title, sub:occasionYears(o, d) || (o.yearly ? 'Every year' : ''), done:false, paid:true, repeating:o.yearly});
  const usedSessions = new Set();
  for(const t of state.templates){
    if(!t.schedule) continue;
    for(const d of Recurrence.expand(t.schedule.recurrence, from, to)){
      const sess = state.sessions.find(s => s.templateId === t.id && s.date === d && !usedSessions.has(s.id));
      if(sess) usedSessions.add(sess.id);
      out.push({type:'workout', kind:'wsched', id:t.id, x:'', date:d, time:t.schedule.time, title:t.name, sub:t.category,
                done:!!sess, sessionId: sess ? sess.id : '', repeating: Recurrence.isRepeating(t.schedule.recurrence)});
    }
  }
  for(const s of state.sessions){
    if(s.date < from || s.date > to || usedSessions.has(s.id)) continue;
    out.push({type:'workout', kind:'session', id:s.id, x:'', date:s.date, time:'', title:s.name, sub:'Logged workout', done:true});
  }
  for(const s of state.supplements){
    for(const d of Recurrence.expand(s.recurrence, from, to))
      out.push({type:'supplement', kind:'supp', id:s.id, x:'', date:d, time:timingTime(s), title:s.name, sub:s.dose, done:!!s.log[d], repeating:Recurrence.isRepeating(s.recurrence)});
  }
  for(const g of state.goals){
    for(const p of g.plans){
      for(const d of Recurrence.expand(p.recurrence, from, to)){
        if(g.contributions.some(c => c.planId === p.id && c.planDate === d)) continue;
        out.push({type:'savings', kind:'plan', id:g.id, x:p.id, date:d, time:'', title: `${g.name}${p.amount ? ' · ' + fmtMoney(p.amount) : ''}`, sub:'Planned contribution', done:false, repeating:Recurrence.isRepeating(p.recurrence)});
      }
    }
    for(const c of g.contributions){
      if(c.date < from || c.date > to) continue;
      out.push({type:'savings', kind:'contrib', id:g.id, x:c.id, date:c.date, time:'', title:`${g.name} · ${fmtMoney(c.amount)}`, sub:'Saved', done:true});
    }
  }
  for(const e of state.expenses){
    for(const i of e.items){
      if(!i.date || i.date < from || i.date > to) continue;
      out.push({type:'expense', kind:'expense', id:e.id, x:i.id, date:i.date, time:'', title:`${i.name} · ${fmtMoney(i.amount)}`, sub:e.name, done:false, paid:true});
    }
  }
  for(const t of state.tasks){
    if(!t.recurrence) continue;
    for(const d of Recurrence.expand(t.recurrence, from, to))
      out.push({type:'task', kind:'task', id:t.id, x:'', date:d, time:'', title:t.title, sub:(HORIZONS.find(h => h.id === t.horizon) || {}).label, done:taskDoneOn(t, d), repeating:taskIsRepeating(t)});
  }
  for(const h of state.habits){
    for(const k in h.checks) if(k >= from && k <= to) out.push({type:'habit', kind:'habit', id:h.id, x:'', date:k, time:'', title:h.name, sub:'Checked in', done:true});
    if(today >= from && today <= to && !h.checks[today] && HabitLogic.isDue(h, today))
      out.push({type:'habit', kind:'habit', id:h.id, x:'', date:today, time:'', title:h.name, sub:'Due today', done:false});
  }
  out.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '') ||
    TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) || a.title.localeCompare(b.title));
  return out;
}
function itemAttrs(it){ return `data-act="openItem" data-kind="${it.kind}" data-id="${esc(it.id)}" data-x="${esc(it.x)}" data-date="${it.date}"`; }
function findItem(ref){ return collectItems(ref.date, ref.date).find(i => i.kind === ref.kind && i.id === ref.id && (i.x || '') === (ref.x || '')) || null; }
function itemRowHTML(it, showDate){
  const bits = [TYPES[it.type]];
  if(showDate) bits.unshift(fmtDate(it.date, 'short'));
  if(it.time) bits.push(fmtTime(it.time));
  if(it.sub) bits.push(it.sub);
  return `<button type="button" class="item-row type-${it.type}" ${itemAttrs(it)}>
    <span class="dot ${it.done || it.paid ? '' : 'hollow'}"></span>
    <span class="t"><span class="name ${it.done ? 'struck' : ''}">${esc(it.title)}</span><span class="meta">${bits.map(esc).join(' · ')}</span></span>
    ${it.done ? '<span class="done-tag">Done</span>' : ''}${icon('chevR')}</button>`;
}

function addToLibrary(names){
  for(const n of names){
    const name = str(n, 80);
    if(name && !state.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) state.exercises.push({name, sample:false});
