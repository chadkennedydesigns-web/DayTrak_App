}
function libraryOptions(){ return state.exercises.slice().sort((a, b) => a.name.localeCompare(b.name)).map(e => `<option value="${esc(e.name)}"></option>`).join(''); }
function exerciseSummary(e){ return `${e.sets} × ${e.reps}${e.weight ? ' · ' + fmtWeight(e.weight, e.unit) : ''}`; }
function setsDone(s){ let d = 0, t = 0; for(const e of s.exercises) for(const x of e.sets){ t++; if(x.done) d++; } return {done:d, total:t}; }

function viewWorkouts(){

  } else {

      ${lib.length ? `<div class="lib">${lib.map(e => `<span class="tag">${esc(e.name)}<button type="button" class="icon-btn" data-act="delExercise" data-name="${esc(e.name)}" aria-label="Remove ${esc(e.name)} from suggestions">${icon('close', 'sm')}</button></span>`).join('')}</div>` : '<p class="empty">No saved exercises yet.</p>'}
    </section>`;
  }
  return `<div class="page-head"><div><h1>Workouts</h1><p class="sub">Build reusable workouts, put them on your calendar and log your sets.</p></div>
    <div class="actions"><button class="btn" data-act="pickWorkout">${icon('play')} Log a workout</button><button class="btn primary" data-act="newWorkout">${icon('add')} New workout</button></div></div>
    <div class="seg" role="group" aria-label="Workout sections" style="margin-bottom:16px">${tabs.map(([id, l]) => `<button type="button" data-act="wTab" data-tab="${id}" aria-pressed="${tab === id}">${l}</button>`).join('')}</div>
    ${body}`;
}
function templateCard(t){
  const ex = t.exercises;
  return `<article class="card type-workout">
    <div class="card-head"><div class="title-wrap"><h3 class="card-title">${esc(t.name)}</h3><span class="badge" style="margin-top:4px">${esc(t.category)}</span></div>

      <button class="icon-btn" data-act="delWorkout" data-id="${t.id}" aria-label="Delete ${esc(t.name)}">${icon('delete')}</button></div>
    ${ex.length ? `<ul class="ex-preview">${ex.slice(0, 5).map(e => `<li><span class="n">${esc(e.name)}</span><span class="d">${esc(exerciseSummary(e))}</span></li>`).join('')}${ex.length > 5 ? `<li><span class="meta">+${ex.length - 5} more</span></li>` : ''}</ul>` : '<p class="empty">No exercises yet.</p>'}
    <p class="meta" style="margin-top:10px;display:flex;gap:6px;align-items:center">${icon('calendar', 'sm')} ${t.schedule ? esc(Recurrence.describe(t.schedule.recurrence) + (t.schedule.time ? ' at ' + fmtTime(t.schedule.time) : '')) : 'Not on your calendar'}</p>
    <div class="card-foot"><button class="btn primary" data-act="startWorkout" data-id="${t.id}">${icon('play')} Start</button></div>

function openWorkoutEditor(id, opts){
  opts = opts || {};
  const today = Dates.today();
  const src = id ? byId(state.templates, id) : null;
  if(id && !src){ toast('That workout no longer exists.'); return; }
  const du = displayUnit();
  const rows = (src ? src.exercises : []).map(e => ({name:e.name, sets:String(e.sets), reps:String(e.reps), w:weightText(e.weight, e.unit), orig:{weight:e.weight, unit:e.unit}}));
  const blank = () => ({name:'', sets:'3', reps:'10', w:'', orig:null});
  if(!rows.length) rows.push(blank());
  const schedOn = !!(src && src.schedule) || !!opts.date;
  const startDate = opts.date || today;
  const sched = src && src.schedule ? clone(src.schedule) : {time:'07:00', recurrence: Object.assign(Recurrence.create(startDate), {freq:'week'})};
  const m = Modal.open({
    title: src ? 'Edit workout' : 'New workout', size:'wide',
    body: `<form novalidate>
      <div class="row">
        <label class="field" style="flex:2 1 220px"><span class="field-label">Workout name</span><input class="input" data-w="name" maxlength="80" placeholder="e.g. Monday Push" value="${esc(src ? src.name : '')}"></label>
        <label class="field"><span class="field-label">Category</span><select class="input" data-w="category">${CATEGORIES.map(c => `<option ${src && src.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      </div>
      <h3 class="section-title">Exercises</h3>
      <p class="hint">Start typing a name to see saved exercises. Weight is in ${du}; leave it empty for bodyweight.</p>
      <div class="ex-list"></div>
      <button type="button" class="btn tonal" data-m="add" style="margin-top:12px">${icon('add')} Add exercise</button>
      <h3 class="section-title">Calendar</h3>
      <label class="check-line"><input type="checkbox" data-w="sched" ${schedOn ? 'checked' : ''}><span>Put this workout on my calendar</span></label>
      <div class="sched-box" ${schedOn ? '' : 'hidden'}>
        <label class="field" style="max-width:200px"><span class="field-label">Time</span><input class="input" type="time" data-w="time" value="${esc(sched.time)}"></label>
        <div class="rec-host"></div>
      </div>
      <p class="form-error field-error" role="alert"></p>
      <datalist id="exlib-${m_id()}">${libraryOptions()}</datalist>
    </form>`,
    footer: `<button type="button" class="btn text" data-modal-close>Cancel</button><button type="button" class="btn primary" data-m="save">Save workout</button>`
  });
  const listId = m.body.querySelector('datalist').id;
  const list = m.body.querySelector('.ex-list');
  const renderRows = focus => {
    list.innerHTML = rows.map((r, i) => `<div class="ex-row" data-i="${i}">
      <label class="field"><span class="field-label">Exercise ${i + 1}</span><input class="input" list="${listId}" data-f="name" value="${esc(r.name)}" maxlength="80" placeholder="e.g. Bench Press" autocomplete="off"></label>
      <div class="ex-nums">
        <label class="field"><span class="field-label">Sets</span><input class="input" type="number" inputmode="numeric" min="1" max="50" data-f="sets" value="${esc(r.sets)}"></label>
        <label class="field"><span class="field-label">Reps</span><input class="input" type="number" inputmode="numeric" min="1" max="1000" data-f="reps" value="${esc(r.reps)}"></label>
        <label class="field"><span class="field-label">Weight (${du})</span><input class="input" type="text" inputmode="decimal" data-f="w" value="${esc(r.w)}" placeholder="0"></label>
      </div>
      <div class="ex-tools">
        <button type="button" class="icon-btn" data-m="up" aria-label="Move exercise ${i + 1} up" ${i === 0 ? 'disabled' : ''}>${icon('up')}</button>
        <button type="button" class="icon-btn" data-m="down" aria-label="Move exercise ${i + 1} down" ${i === rows.length - 1 ? 'disabled' : ''}>${icon('down')}</button>
        <button type="button" class="icon-btn" data-m="del" aria-label="Remove exercise ${i + 1}">${icon('delete')}</button>
      </div></div>`).join('') || '<p class="empty">No exercises. Add one below.</p>';
    if(focus){ const f = list.querySelector(focus); if(f) f.focus(); }
  };
  renderRows();
  const recEd = RecurrenceEditor(m.body.querySelector('.rec-host'), sched.recurrence, {startLabel:'Starting on'});
  list.addEventListener('input', e => {
    const f = e.target.dataset.f, row = e.target.closest('[data-i]');
    if(f && row) rows[+row.dataset.i][f] = e.target.value;
  });
  m.body.querySelector('[data-w=sched]').addEventListener('change', e => { m.body.querySelector('.sched-box').hidden = !e.target.checked; });
  m.body.querySelector('form').addEventListener('submit', e => { e.preventDefault(); save(); });
  m.el.addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if(!b) return;
    const rowEl = b.closest('[data-i]'); const i = rowEl ? +rowEl.dataset.i : -1;
    const act = b.dataset.m;
    if(act === 'add'){ rows.push(blank()); renderRows(`[data-i="${rows.length - 1}"] [data-f=name]`); }
    else if(act === 'up' && i > 0){ [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]]; renderRows(`[data-i="${i - 1}"] [data-m=${i - 1 === 0 ? 'down' : 'up'}]`); }
    else if(act === 'down' && i < rows.length - 1){ [rows[i + 1], rows[i]] = [rows[i], rows[i + 1]]; renderRows(`[data-i="${i + 1}"] [data-m=${i + 1 === rows.length - 1 ? 'up' : 'down'}]`); }
    else if(act === 'del'){ rows.splice(i, 1); renderRows(); }
    else if(act === 'save') save();
  });
  function save(){
    const nameEl = m.body.querySelector('[data-w=name]');
    const name = nameEl.value.trim();
    if(!name) return setFormError(m, 'Give your workout a name.', nameEl);
    const exercises = [];
    for(let i = 0; i < rows.length; i++){
      const r = rows[i], q = f => list.querySelector(`[data-i="${i}"] [data-f=${f}]`);
      const nm = r.name.trim();
      if(!nm){ if(r.w.trim() === '') continue; return setFormError(m, `Exercise ${i + 1}: enter a name or remove the row.`, q('name')); }
      if(nm.length > 80) return setFormError(m, `Exercise ${i + 1}: the name is too long.`, q('name'));
      const sets = parseWhole(r.sets); if(!(sets >= 1 && sets <= 50)) return setFormError(m, `Exercise ${i + 1}: sets must be a whole number from 1 to 50.`, q('sets'));
      const reps = parseWhole(r.reps); if(!(reps >= 1 && reps <= 1000)) return setFormError(m, `Exercise ${i + 1}: reps must be a whole number from 1 to 1000.`, q('reps'));
      const w = readWeight(r.w, r.orig); if(w.error) return setFormError(m, `Exercise ${i + 1}: ${w.error}`, q('w'));
      exercises.push({id: uid(), name: nm, sets, reps, weight: w.weight, unit: w.unit});
    }
    let schedule = null;
    if(m.body.querySelector('[data-w=sched]').checked){
      const timeEl = m.body.querySelector('[data-w=time]');
      if(timeEl.value && !validTime(timeEl.value)) return setFormError(m, 'Enter a valid time, or leave it empty.', timeEl);
      const rr = recEd.read(); if(rr.error) return setFormError(m, rr.error);
      schedule = {time: validTime(timeEl.value), recurrence: rr.value};
    }
    const t = src || {id: uid(), sample:false};
    Object.assign(t, {name, category: m.body.querySelector('[data-w=category]').value, exercises, schedule});
    if(!CATEGORIES.includes(t.category)) t.category = 'Full Body';
    if(!src) state.templates.push(t);
    addToLibrary(exercises.map(e => e.name));
    m.close(); commit(); toast(src ? 'Workout saved' : 'Workout created');
  }
}
let modalCounter = 0;
function m_id(){ return ++modalCounter; }

function openSessionLogger(opts){
  const today = Dates.today();
  let src = opts.sessionId ? byId(state.sessions, opts.sessionId) : null;
  if(opts.sessionId && !src){ toast('That workout log no longer exists.'); return; }
  const tpl = opts.templateId ? byId(state.templates, opts.templateId) : (src && src.templateId ? byId(state.templates, src.templateId) : null);
  if(!src && tpl && opts.date){ src = state.sessions.find(s => s.templateId === tpl.id && s.date === opts.date) || null; }
  const du = displayUnit();
  const mkSet = (reps, weight, unit, done) => ({reps: String(reps), w: weightText(weight, unit), orig: {weight, unit}, done: !!done});
  const draft = src ? {
    name: src.name, category: src.category, date: src.date, note: src.note,
    exercises: src.exercises.map(e => ({name: e.name, sets: e.sets.map(s => mkSet(s.reps, s.weight, s.unit, s.done))}))
  } : {
    name: tpl ? tpl.name : '', category: tpl ? tpl.category : '', date: opts.date || today, note: '',
    exercises: tpl ? tpl.exercises.map(e => ({name: e.name, sets: Array.from({length: e.sets}, () => mkSet(e.reps, e.weight, e.unit, false))})) : []
  };
  const m = Modal.open({
    title: src ? 'Workout log' : (tpl ? `Log: ${tpl.name}` : 'Log a workout'), size:'wide',
    body: `<form novalidate>
      <div class="row">
        <label class="field" style="flex:2 1 200px"><span class="field-label">Workout name</span><input class="input" data-s="name" maxlength="80" value="${esc(draft.name)}" placeholder="e.g. Morning lift"></label>
        <label class="field"><span class="field-label">Category</span><select class="input" data-s="category"><option value="">None</option>${CATEGORIES.map(c => `<option ${draft.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        <label class="field"><span class="field-label">Date</span><input class="input" type="date" data-s="date" value="${esc(draft.date)}"></label>
      </div>
      <div class="progress-note"><strong data-progress></strong><button type="button" class="btn tonal" data-m="all">${icon('check')} Mark all sets done</button></div>
      <div class="log-list"></div>
      <div class="add-skip" style="margin:4px 0 16px"><input class="input" list="loglib-${m_id()}" data-s="newex" maxlength="80" placeholder="Add an exercise" aria-label="New exercise name" autocomplete="off"><button type="button" class="btn" data-m="addEx">${icon('add')} Add exercise</button></div>
      <label class="field"><span class="field-label">Note (optional)</span><textarea class="input" data-s="note" maxlength="1000" placeholder="How did it feel?">${esc(draft.note)}</textarea></label>
      <p class="form-error field-error" role="alert"></p>
      <datalist id="loglib-${modalCounter}">${libraryOptions()}</datalist>
    </form>`,
    footer: `${src ? '<button type="button" class="btn text danger left" data-m="delete">Delete log</button>' : ''}<button type="button" class="btn text" data-modal-close>Cancel</button><button type="button" class="btn primary" data-m="save">Save log</button>`
  });
  const list = m.body.querySelector('.log-list');
  const progress = () => {
    let d = 0, t = 0; for(const e of draft.exercises) for(const s of e.sets){ t++; if(s.done) d++; }
    m.body.querySelector('[data-progress]').textContent = t ? `${d} of ${t} sets done` : 'No sets yet — add an exercise below.';
  };
  const renderList = focus => {
    list.innerHTML = draft.exercises.map((e, ei) => `<div class="log-ex" data-ei="${ei}">
      <div class="log-ex-head"><strong>${esc(e.name)}</strong><button type="button" class="icon-btn" data-m="delEx" aria-label="Remove ${esc(e.name)}">${icon('delete')}</button></div>
      ${e.sets.length ? `<div class="set-head"><span>Set</span><span>Reps</span><span>Weight (${du})</span><span></span></div>` : ''}
      ${e.sets.map((s, si) => `<div class="set-row ${s.done ? 'done' : ''}" data-si="${si}">
        <label class="set-check"><input type="checkbox" data-sf="done" ${s.done ? 'checked' : ''}><span>Set ${si + 1}</span></label>
        <input class="input" type="number" inputmode="numeric" min="0" max="1000" data-sf="reps" value="${esc(s.reps)}" aria-label="${esc(e.name)} set ${si + 1} reps">
        <input class="input" type="text" inputmode="decimal" data-sf="w" value="${esc(s.w)}" placeholder="0" aria-label="${esc(e.name)} set ${si + 1} weight in ${du}">
        <button type="button" class="icon-btn" data-m="delSet" aria-label="Remove set ${si + 1}">${icon('close')}</button></div>`).join('')}
      <button type="button" class="btn text" data-m="addSet">${icon('add')} Add set</button></div>`).join('');
    progress();
    if(focus){ const f = list.querySelector(focus); if(f) f.focus(); }
  };
  renderList();
  const loc = el => { const ex = el.closest('[data-ei]'), st = el.closest('[data-si]'); return [ex ? +ex.dataset.ei : -1, st ? +st.dataset.si : -1]; };
  list.addEventListener('input', e => {
    const f = e.target.dataset.sf; if(!f || f === 'done') return;
    const [ei, si] = loc(e.target); draft.exercises[ei].sets[si][f] = e.target.value;
  });
  list.addEventListener('change', e => {
    if(e.target.dataset.sf !== 'done') return;
    const [ei, si] = loc(e.target); draft.exercises[ei].sets[si].done = e.target.checked;
    e.target.closest('.set-row').classList.toggle('done', e.target.checked); progress();
  });
  const addExercise = () => {
    const inp = m.body.querySelector('[data-s=newex]');
    const nm = inp.value.trim();
    if(!nm){ inp.setAttribute('aria-invalid', 'true'); inp.focus(); return; }
    inp.removeAttribute('aria-invalid');
    const t = tpl && tpl.exercises.find(x => x.name.toLowerCase() === nm.toLowerCase());
    draft.exercises.push({name: nm.slice(0, 80), sets: t ? Array.from({length: t.sets}, () => mkSet(t.reps, t.weight, t.unit, false)) : [mkSet(10, 0, du, false)]});
    inp.value = ''; renderList(); inp.focus();
  };
  m.body.querySelector('[data-s=newex]').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addExercise(); } });
  m.body.querySelector('form').addEventListener('submit', e => e.preventDefault());
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if(!b) return;
    const [ei, si] = loc(b);
    switch(b.dataset.m){
      case 'all': { const allDone = draft.exercises.every(x => x.sets.every(s => s.done)); draft.exercises.forEach(x => x.sets.forEach(s => { s.done = !allDone; })); renderList(); break; }
      case 'addEx': addExercise(); break;
      case 'delEx': draft.exercises.splice(ei, 1); renderList(); break;
      case 'addSet': { const sets = draft.exercises[ei].sets; const last = sets[sets.length - 1]; sets.push(last ? Object.assign({}, last, {done:false, orig: last.orig ? Object.assign({}, last.orig) : null}) : mkSet(10, 0, du, false)); renderList(`[data-ei="${ei}"] [data-si="${sets.length - 1}"] [data-sf=reps]`); break; }
      case 'delSet': draft.exercises[ei].sets.splice(si, 1); renderList(); break;
      case 'delete':
        if(await confirmBox({title:'Delete this workout log?', message:'The sets you logged for this day will be removed.', ok:'Delete', danger:true})){
          m.close(); withUndo('Workout log deleted', () => { state.sessions = state.sessions.filter(s => s.id !== src.id); });
        }
        break;
      case 'save': save(); break;
    }
  });
  function save(){
    const nameEl = m.body.querySelector('[data-s=name]'), dateEl = m.body.querySelector('[data-s=date]');
    const name = nameEl.value.trim();
    if(!name) return setFormError(m, 'Give this workout a name.', nameEl);
    if(!Dates.isValid(dateEl.value)) return setFormError(m, 'Pick a valid date.', dateEl);
    const exercises = [];
    for(let ei = 0; ei < draft.exercises.length; ei++){
      const e = draft.exercises[ei]; const sets = [];
      for(let si = 0; si < e.sets.length; si++){
        const s = e.sets[si], q = f => list.querySelector(`[data-ei="${ei}"] [data-si="${si}"] [data-sf=${f}]`);
        const reps = parseWhole(s.reps); if(!(reps >= 0 && reps <= 1000)) return setFormError(m, `${e.name}, set ${si + 1}: reps must be a whole number from 0 to 1000.`, q('reps'));
        const w = readWeight(s.w, s.orig); if(w.error) return setFormError(m, `${e.name}, set ${si + 1}: ${w.error}`, q('w'));
        sets.push({reps, weight: w.weight, unit: w.unit, done: s.done});
      }
      if(sets.length) exercises.push({name: e.name, sets});
    }
    if(!exercises.length) return setFormError(m, 'Add at least one exercise with a set.', m.body.querySelector('[data-s=newex]'));
    const cat = m.body.querySelector('[data-s=category]').value;
    const sess = src || {id: uid(), templateId: tpl ? tpl.id : '', sample:false};
    Object.assign(sess, {name: name.slice(0, 80), category: CATEGORIES.includes(cat) ? cat : '', date: dateEl.value, note: m.body.querySelector('[data-s=note]').value.trim().slice(0, 1000), exercises});
    if(!src) state.sessions.push(sess);
    addToLibrary(exercises.map(e => e.name));
    m.close(); commit(); toast(src ? 'Workout log updated' : 'Workout logged — nice work!');
  }
}

function suppChecklist(today){
  const list = suppsOn(today);
  if(!list.length) return '';
  return TIMINGS.map(t => {
    const items = list.filter(s => s.timing === t.id).sort((a, b) => timingTime(a).localeCompare(timingTime(b)) || a.name.localeCompare(b.name));
    if(!items.length) return '';
    return `<div class="group-label">${t.label}</div>` + items.map(s => `<div class="check-row ${s.log[today] ? 'done' : ''}">
      <label class="check-hit"><input type="checkbox" data-chg="supp" data-id="${s.id}" data-date="${today}" ${s.log[today] ? 'checked' : ''}>

  }).join('');
}

function occasionWhen(d, today){

}

function taskRowHTML(t, today, withTools){
  const done = taskIsDone(t, today);
  const meta = [];
  if(t.recurrence){
    if(taskIsRepeating(t)){
      meta.push(Recurrence.describe(t.recurrence));
      const cd = taskCurrentDate(t, today);
      if(cd) meta.push((done ? 'Done for ' : 'For ') + relDay(cd, today));
    } else {
      const due = t.recurrence.start;
      meta.push((!done && due < today ? '<span class="overdue">Overdue · ' : '<span>Due ') + esc(relDay(due, today)) + '</span>');
    }
  }
  return `<div class="check-row ${done ? 'done' : ''}">
    <label class="check-hit"><input type="checkbox" data-chg="task" data-id="${t.id}" ${done ? 'checked' : ''}>
    <span class="t"><span class="name">${esc(t.title)}</span>${meta.length ? `<span class="meta">${meta.map(x => x.startsWith('<span') ? x : esc(x)).join(' · ')}</span>` : ''}</span></label>
    ${taskIsRepeating(t) ? `<span class="side" title="Repeats">${icon('repeat', 'sm')}</span>` : ''}
    ${withTools ? `<button class="icon-btn" data-act="editTask" data-id="${t.id}" aria-label="Edit ${esc(t.title)}">${icon('edit')}</button><button class="icon-btn" data-act="delTask" data-id="${t.id}" aria-label="Delete ${esc(t.title)}">${icon('delete')}</button>` : ''}
  </div>`;
}

    }).join('')}</div>

    <div class="cal-wrap">${v === 'month' ? monthGrid(a, today) : weekGrid(a, today)}</div>
    <p class="hint" style="margin-top:12px">Tap a day to see everything on it. Tap an item to mark it done, edit, move or delete it.</p>`;

/* Calendar display week start (Settings > Calendar). Recurrence rules and habit stats keep Monday-based weeks. */
function calSunday(){ return state.settings.weekStart === 'sun'; }
function calWeekStart(s){ return calSunday() ? Dates.add(s, -((Dates.dow(s) + 1) % 7)) : Dates.weekStart(s); }
function calWdLabels(){ return calSunday() ? ['Sun'].concat(WD_SHORT.slice(0, 6)) : WD_SHORT; }
function calItems(from, to){ const hide = state.settings.calHidden; return collectItems(from, to).filter(it => !hide.includes(it.type)); }
function bucket(items){ const b = {}; for(const it of items) (b[it.date] = b[it.date] || []).push(it); return b; }
function monthGrid(a, today){
  const first = Dates.monthStart(a), last = Dates.monthEnd(a);
  const gs = calWeekStart(first), ge = Dates.add(calWeekStart(last), 6);
  const b = bucket(calItems(gs, ge));
  let h = `<div class="month">${calWdLabels().map((d, i) => `<div class="mhead" aria-hidden="true"><span>${ui.narrow ? d[0] : d}</span></div>`).join('')}`;
  for(const d of Dates.range(gs, ge)){
    const items = (b[d] || []).slice().sort((x, y) => TYPE_ORDER.indexOf(x.type) - TYPE_ORDER.indexOf(y.type) || (x.time || '').localeCompare(y.time || ''));
    const other = d.slice(0, 7) !== first.slice(0, 7);
    h += `<div class="mcell ${other ? 'other' : ''} ${d === today ? 'today' : ''}" data-act="openDay" data-date="${d}">
      <button type="button" class="mday" data-act="openDay" data-date="${d}" aria-label="${esc(fmtDate(d, 'long'))}${items.length ? ', ' + plural(items.length, 'item') : ''}">${+d.slice(8)}</button>
      ${items.slice(0, 3).map(it => `<button type="button" class="chip type-${it.type} ${it.done ? 'done' : ''}" ${itemAttrs(it)} title="${esc(it.title)}">${esc(it.title)}</button>`).join('')}
      ${items.length > 3 ? `<button type="button" class="more" data-act="openDay" data-date="${d}">+${items.length - 3}${ui.narrow ? '' : ' more'}</button>` : ''}
    </div>`;
  }
  return h + '</div>';
}
function hourOf(t){ return validTime(t) ? +t.slice(0, 2) : -1; }
function fmtHour(h){
  try { return new Date(2000, 0, 1, h).toLocaleTimeString(undefined, {hour:'numeric'}); } catch(e){ return String(h).padStart(2, '0') + ':00'; }
}
const WEEK_HOURS = [6, 22]; // default visible range; widened automatically if the week has earlier/later items
const UNTIMED_HOUR = 9;     // week view: items with no set time (habits, untimed tasks/savings) are shown in this hour's row
function placeHour(it){ const h = hourOf(it.time); return h >= 0 ? h : UNTIMED_HOUR; }
function weekGrid(a, today){
  const ws = calWeekStart(a);
  const days = Dates.range(ws, Dates.add(ws, 6));
  const b = bucket(calItems(ws, days[6]));
  if(ui.narrow){
    return `<div class="wlist">${days.map(d => {
      const items = b[d] || [];
      return `<div class="wday ${d === today ? 'today' : ''}"><button type="button" class="wday-head" data-act="openDay" data-date="${d}">${esc(fmtDate(d, 'day'))}<span class="cnt">${items.length ? plural(items.length, 'item') : 'Free'}</span></button>
        ${items.map(it => itemRowHTML(it)).join('')}</div>`;
    }).join('')}</div>`;
  }
  const chip = it => `<button type="button" class="wchip type-${it.type} ${it.done ? 'done' : ''}" ${itemAttrs(it)} title="${esc(it.title)}"><span class="wn">${esc(it.title)}</span></button>`;
  let lo = WEEK_HOURS[0], hi = WEEK_HOURS[1];
  for(const d of days) for(const it of (b[d] || [])){ const hr = hourOf(it.time); if(hr >= 0){ lo = Math.min(lo, hr); hi = Math.max(hi, hr); } }
  const nowHr = new Date().getHours();
  let h = `<div class="week"><div class="wslot"></div>`;
  h += days.map((d, i) => `<div class="wh ${d === today ? 'today' : ''}"><button type="button" data-act="openDay" data-date="${d}" aria-label="${esc(fmtDate(d, 'long'))}"><span class="dn">${calWdLabels()[i]}</span><span class="dd">${+d.slice(8)}</span></button></div>`).join('');
  for(let hr = lo; hr <= hi; hr++){

function moveFlag(map, from, to){ if(map[from]){ delete map[from]; map[to] = true; } }
async function deleteOccurrence(it, isRepeating, nameAll, onSkip, onAll){

    const c = await choiceBox('Delete repeating item', `“${esc(it.title)}” repeats. Remove just ${esc(fmtDate(it.date, 'long'))}, or every date?`, [{id:'one', label:'Just this date'}, {id:'all', label: nameAll, danger:true, primary:true}]);

async function detailAction(act, ref, m){
  const it = findItem(ref); if(!it){ m.close(); return; }
  const today = Dates.today();
  const moved = to => { ref.date = to; commit(); toast(`Moved to ${fmtDate(to, 'short')}`); };
  switch(ref.kind){
    case 'wsched': {
      const t = byId(state.templates, ref.id);
      if(act === 'start') openSessionLogger({templateId: t.id, date: ref.date});
      else if(act === 'viewlog') openSessionLogger({sessionId: it.sessionId});
      else if(act === 'undone'){ if(await confirmBox({title:'Mark as not done?', message:'This removes the workout log for this day.', ok:'Remove log', danger:true})) withUndo('Workout log removed', () => { state.sessions = state.sessions.filter(s => s.id !== it.sessionId); }); }
      else if(act === 'edit') openWorkoutEditor(t.id);
      else if(act === 'resched') openReschedule('Move this workout', ref.date, to => { t.schedule.recurrence = Recurrence.moveOccurrence(t.schedule.recurrence, ref.date, to); moved(to); });
      else if(act === 'delete') deleteOccurrence(it, it.repeating, 'Remove all dates', () => { t.schedule.recurrence = Recurrence.skip(t.schedule.recurrence, ref.date); }, () => { t.schedule = null; });
      break;
    }
    case 'session': {
      const s = byId(state.sessions, ref.id);
      if(act === 'edit') openSessionLogger({sessionId: s.id});
      else if(act === 'resched') openReschedule('Change workout date', ref.date, to => { s.date = to; moved(to); });
      else if(act === 'delete'){ if(await confirmBox({title:'Delete this workout log?', message:`“${esc(s.name)}” on ${esc(fmtDate(s.date, 'long'))} will be removed.`, ok:'Delete', danger:true})) withUndo('Workout log deleted', () => { state.sessions = state.sessions.filter(x => x.id !== s.id); }); }
      break;
    }
    case 'supp': {
      const s = byId(state.supplements, ref.id);
      if(act === 'done' || act === 'undone'){ if(act === 'done') s.log[ref.date] = true; else delete s.log[ref.date]; commit(); }
      else if(act === 'edit') openSuppEditor(s.id);
      else if(act === 'resched') openReschedule('Move this dose', ref.date, to => { s.recurrence = Recurrence.moveOccurrence(s.recurrence, ref.date, to); moveFlag(s.log, ref.date, to); moved(to); });
      else if(act === 'delete') deleteOccurrence(it, it.repeating, 'Delete supplement', () => { s.recurrence = Recurrence.skip(s.recurrence, ref.date); }, () => { state.supplements = state.supplements.filter(x => x.id !== s.id); });
      break;
    }
    case 'plan': {
      const g = byId(state.goals, ref.id), p = g.plans.find(x => x.id === ref.x);
      if(act === 'done') openContribEditor(g.id, null, {planId: p.id, planDate: ref.date, amount: p.amount});
      else if(act === 'edit') openPlanEditor(g.id, p.id);
      else if(act === 'resched') openReschedule('Move planned contribution', ref.date, to => { p.recurrence = Recurrence.moveOccurrence(p.recurrence, ref.date, to); moved(to); });
      else if(act === 'delete') deleteOccurrence(it, it.repeating, 'Delete whole plan', () => { p.recurrence = Recurrence.skip(p.recurrence, ref.date); }, () => { g.plans = g.plans.filter(x => x.id !== p.id); });
      break;
    }
    case 'contrib': {
      const g = byId(state.goals, ref.id), c = g.contributions.find(x => x.id === ref.x);
      if(act === 'edit') openContribEditor(g.id, c.id);
      else if(act === 'resched') openReschedule('Change contribution date', ref.date, to => { c.date = to; moved(to); });
      else if(act === 'delete'){ if(await confirmBox({title:'Delete this contribution?', message:`${fmtMoney(c.amount)} will be removed from ${esc(g.name)}.`, ok:'Delete', danger:true})) withUndo('Contribution deleted', () => { g.contributions = g.contributions.filter(x => x.id !== c.id); }); }
      break;
    }
    case 'expense': {
      const e = byId(state.expenses, ref.id), i = e.items.find(x => x.id === ref.x);
      if(act === 'edit') openExpenseItemEditor(e.id, i.id);
      else if(act === 'resched') openReschedule('Change expense date', ref.date, to => { i.date = to; moved(to); });
      else if(act === 'delete'){ if(await confirmBox({title:'Delete this expense?', message:`“${esc(i.name)}” (${fmtMoney(i.amount)}) will be removed from ${esc(e.name)}.`, ok:'Delete', danger:true})) withUndo('Expense deleted', () => { e.items = e.items.filter(x => x.id !== i.id); }); }
      break;
    }
    case 'occasion': {
      if(act === 'edit') openOccasionEditor(ref.id);
      else if(act === 'delete') deleteOccasion(ref.id);
      break;
    }
    case 'task': {
      const t = byId(state.tasks, ref.id);
      if(act === 'done' || act === 'undone'){ setTaskDoneOn(t, ref.date, act === 'done', today); commit(); }
      else if(act === 'edit') openTaskEditor(t.id);
      else if(act === 'resched') openReschedule('Move this task', ref.date, to => { t.recurrence = Recurrence.moveOccurrence(t.recurrence, ref.date, to); moveFlag(t.doneDates, ref.date, to); moved(to); });
      else if(act === 'delete') deleteOccurrence(it, it.repeating, 'Delete task', () => { t.recurrence = Recurrence.skip(t.recurrence, ref.date); }, () => { state.tasks = state.tasks.filter(x => x.id !== t.id); });
      break;
    }
    case 'habit': {
      const h = byId(state.habits, ref.id);
      if(act === 'done'){ h.checks[ref.date] = true; commit(); }
      else if(act === 'undone'){ delete h.checks[ref.date]; commit(); }
      else if(act === 'edit') openHabitEditor(h.id);
      break;
    }
  }
}

function viewDashboard(){

  const habits = state.habits.filter(h => HabitLogic.isDue(h, today)), hDone = habits.filter(h => h.checks[today]).length;
  const parts = [];

  if(supps.length) parts.push(`${sDone} of ${supps.length} supplements taken`);
  if(habits.length) parts.push(`${hDone} of ${habits.length} habits done`);
  const nothing = !state.tasks.length && !state.templates.length && !state.sessions.length && !state.supplements.length && !state.goals.length && !state.expenses.length && !state.habits.length;

    <div class="tiles">
      ${tile('tasks', 'task', 'task', 'Tasks', `${tDone}/${tasks.length}`, overdue ? `${overdue} overdue` : (tasks.length ? `${tasks.length - tDone} still to do` : 'nothing yet'))}

      ${tile('supplements', 'supplement', 'supplement', 'BioStack', `${sDone}/${supps.length}`, supps.length ? 'taken today' : 'none today')}
      ${tile('habits', 'habit', 'habit', 'Habits', `${hDone}/${habits.length}`, habits.length ? `${Math.round(hDone / habits.length * 100)}% complete` : 'none due today')}

const DASH_NAMES = {tasks:'Tasks', workout:'Workouts', calendar:'Calendar', supplements:'BioStack', habits:'Habits', savings:'Savings', expenses:'Expenses', notes:'Notes', dates:'Important Dates', upcoming:'Next 7 days'};
function dashCardsHTML(today, tasks, supps, habits){

const DashDrag = {
  start(e){
    if(!ui.arrange || e.button > 0) return;
    const grid = $('#dashGrid'); if(!grid) return;
    const card = e.target.closest('[data-card]'); if(!card || !grid.contains(card)) return;
    if(e.target.closest('button')) return;
    if(e.pointerType !== 'mouse' && !e.target.closest('.arr-handle')) return;
    e.preventDefault();
    const s = {card, grid, id: e.pointerId, last: null, moved: false};
    card.classList.add('dragging');
    const move = ev => {
      if(ev.pointerId !== s.id) return;
      ev.preventDefault();
      card.style.pointerEvents = 'none';
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      card.style.pointerEvents = '';
      const tgt = under && under.closest('[data-card]');
      if(!tgt || tgt === card || !grid.contains(tgt)) { s.last = null; return; }
      const r = tgt.getBoundingClientRect();
      const before = ev.clientY < r.top + r.height / 2;
      const key = tgt.dataset.card + (before ? '<' : '>');
      if(key === s.last) return; // avoid flip-flopping while columns re-flow
      s.last = key;
      grid.insertBefore(card, before ? tgt : tgt.nextSibling);
      s.moved = true;
    };
    const end = ev => {
      if(ev.pointerId !== s.id) return;
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      card.classList.remove('dragging');
      if(s.moved){
        state.settings.dashOrder = normalizeDashOrder([...grid.querySelectorAll('[data-card]')].map(c => c.dataset.card));
        commit();
      }
    };
    document.addEventListener('pointermove', move, {passive:false});
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);

const COLLECTIONS = [['templates','Workouts'],['sessions','Logged workouts'],['exercises','Saved exercises'],['supplements','BioStack'],['goals','Savings goals'],['expenses','Expense budgets'],['tasks','Tasks'],['habits','Habits'],['notes','Notes'],['occasions','Important dates']];
function exportData(){
  const payload = Object.assign({app: APP_NAME, exportedAt: new Date().toISOString()}, state);
  download(`daytrak-backup-${Dates.today()}.json`, JSON.stringify(payload, null, 2));
  toast('Backup downloaded');
}
function importFile(file){
  if(!file) return;
  if(file.size > 20 * 1024 * 1024){ toast('That file is too large to be a backup.'); return; }
  const reader = new FileReader();
  reader.onerror = () => toast("Couldn't read that file.");
  reader.onload = () => {
    let parsed, next;
    try { parsed = JSON.parse(String(reader.result)); }
    catch(e){ confirmBox({title:"That file can't be imported", message:'It isn’t a valid backup file (the JSON could not be read). Nothing was changed.', ok:'OK', cancel:'Close'}); return; }
    if(!isObj(parsed) || !COLLECTIONS.some(([k]) => k in parsed) && !('settings' in parsed)){
      confirmBox({title:"That file can't be imported", message:`It doesn’t look like a ${esc(APP_NAME)} backup. Nothing was changed.`, ok:'OK', cancel:'Close'}); return;
    }
    try { next = loadData(parsed); } catch(e){ toast("That backup couldn't be read."); return; }
    openImportPreview(next, normalizeSkipped, file.name);
  };
  reader.readAsText(file);
}
function openImportPreview(next, skipped, name){
  const rows = COLLECTIONS.map(([k, label]) => {
    const a = state[k].length, b = next[k].length;
    return `<tr><td>${label}</td><td class="num">${a}</td><td class="num">${b}</td><td class="num">${b - a > 0 ? '+' : ''}${b - a === 0 ? '—' : b - a}</td></tr>`;
  }).join('');
  const m = Modal.open({
    title: 'Import backup?', size:'wide',
    body: `<p class="hint">From <strong>${esc(name)}</strong>. Importing <strong>replaces</strong> everything currently in the app. Export a backup first if you might want your current data back.</p>
      <table class="table"><thead><tr><th>What</th><th class="num">Now</th><th class="num">After import</th><th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="hint" style="margin-top:12px">Settings after import: ${next.settings.units === 'imperial' ? 'Imperial (lb)' : 'Metric (kg)'}, ${next.settings.theme === 'system' ? 'match device' : next.settings.theme} theme.</p>
      ${skipped ? `<div class="banner">${icon('warning')}<div class="t">${plural(skipped, 'entry', 'entries')} in the file couldn't be read and will be skipped.</div></div>` : ''}`,
    footer: `<button type="button" class="btn text" data-modal-close>Cancel</button><button type="button" class="btn primary" data-ok>Replace my data</button>`
  });
  m.foot.querySelector('[data-ok]').addEventListener('click', () => {
    const snap = clone(state);
    ui.recovery = null;
    state = next; m.close(); applyTheme(); commit();
    toast('Backup imported', () => { state = snap; applyTheme(); commit(); toast('Previous data restored'); });
  });
}
function clearAllData(){
  confirmBox({title:'Clear all data?', message:'This permanently removes every workout, log, supplement, goal, budget, task, habit and note from this browser. Your theme and unit settings are kept. Consider exporting a backup first.', ok:'Clear everything', danger:true, typeToConfirm:'DELETE'}).then(ok => {
    if(!ok) return;
    const keep = clone(state.settings);
    state = emptyState(); state.settings = keep;
    commit(); toast('All data cleared');

function clearSampleData(){
  for(const k of ['templates','sessions','supplements','goals','expenses','tasks','habits','notes','occasions']) state[k] = state[k].filter(x => !x.sample);
  const used = new Set();
  for(const t of state.templates) for(const e of t.exercises) used.add(e.name.toLowerCase());
  for(const s of state.sessions) for(const e of s.exercises) used.add(e.name.toLowerCase());
  state.exercises = state.exercises.filter(e => !e.sample || used.has(e.name.toLowerCase())).map(e => Object.assign(e, {sample:false}));
}
function buildSampleData(today){
  const d = n => Dates.add(today, n);
  const R = (start, o) => Object.assign(Recurrence.create(start), o || {});
  const ex = (name, sets, reps, weight) => ({id: uid(), name, sets, reps, weight, unit:'lb'});
  const templates = [
    {id: uid(), name:'Push Day', category:'Push', sample:true, exercises:[ex('Bench Press',4,8,135), ex('Overhead Press',3,8,95), ex('Incline Dumbbell Press',3,10,50), ex('Tricep Pushdown',3,12,55)], schedule:{time:'07:00', recurrence:R(d(-35), {freq:'week', weekdays:[0,3]})}},
    {id: uid(), name:'Pull Day', category:'Pull', sample:true, exercises:[ex('Barbell Row',4,8,115), ex('Pull-up',3,8,0), ex('Face Pull',3,15,35), ex('Bicep Curl',3,12,25)], schedule:{time:'07:00', recurrence:R(d(-35), {freq:'week', weekdays:[1,4]})}},
    {id: uid(), name:'Leg Day', category:'Legs', sample:true, exercises:[ex('Back Squat',4,6,185), ex('Romanian Deadlift',3,8,155), ex('Walking Lunge',3,10,45), ex('Calf Raise',4,15,90)], schedule:{time:'09:30', recurrence:R(d(-35), {freq:'week', weekdays:[5]})}},
    {id: uid(), name:'Quick Full Body', category:'Full Body', sample:true, exercises:[ex('Goblet Squat',3,12,50), ex('Push-up',3,15,0), ex('Dumbbell Row',3,10,55), ex('Plank',3,1,0)], schedule:null}
  ];
  const sessions = [];
  let k = 0;
  for(const t of templates){
    if(!t.schedule) continue;
    for(const day of Recurrence.expand(t.schedule.recurrence, d(-21), d(-1))){
      k++;
      if(k % 5 === 0) continue;
      sessions.push({id: uid(), templateId: t.id, name: t.name, category: t.category, date: day, sample:true, note: k % 4 === 0 ? 'Felt strong today.' : '',
        exercises: t.exercises.map((e, i) => ({name: e.name, sets: Array.from({length: e.sets}, (_, si) => ({reps: e.reps, weight: e.weight, unit: 'lb', done: !(k % 3 === 0 && i === t.exercises.length - 1 && si === e.sets - 1)}))}))});
    }
  }
  const names = new Set(); templates.forEach(t => t.exercises.forEach(e => names.add(e.name)));
  ['Deadlift','Hip Thrust','Lateral Raise','Leg Press','Chest Fly'].forEach(n => names.add(n));
  const logFor = (rec, days, skipEvery) => { const o = {}; Recurrence.expand(rec, d(-days), d(-1)).forEach((x, i) => { if((i + 1) % skipEvery) o[x] = true; }); return o; };
  const sR = [R(d(-30), {freq:'day'}), R(d(-30), {freq:'week', weekdays:[0,2,4]}), R(d(-30), {freq:'day'}), R(d(-30), {freq:'day'})];
  const supplements = [
    {id: uid(), name:'Vitamin D', dose:'1000 IU', timing:'morning', time:'', recurrence:sR[0], log:logFor(sR[0], 14, 6), sample:true},
    {id: uid(), name:'Fish oil', dose:'2 capsules', timing:'morning', time:'08:30', recurrence:sR[1], log:logFor(sR[1], 14, 4), sample:true},
    {id: uid(), name:'Creatine', dose:'5 g', timing:'anytime', time:'', recurrence:sR[2], log:logFor(sR[2], 14, 5), sample:true},
    {id: uid(), name:'Magnesium', dose:'400 mg', timing:'night', time:'21:30', recurrence:sR[3], log:logFor(sR[3], 14, 7), sample:true}
  ];
  const c = (n, amount, note) => ({id: uid(), date: d(n), amount, note: note || '', planId:'', planDate:''});
  const nextMonthStart = Dates.monthStart(Dates.addMonths(today, 1));
  const goals = [
    {id: uid(), name:'Vacation', target:2000, sample:true, contributions:[c(-75, 400), c(-45, 350), c(-14, 250, 'Bonus')], plans:[{id: uid(), amount:150, recurrence:R(d(4), {freq:'week', interval:2, weekdays:[Dates.dow(d(4))]})}]},
    {id: uid(), name:'Emergency fund', target:5000, sample:true, contributions:[c(-90, 1000), c(-60, 750), c(-30, 750)], plans:[{id: uid(), amount:250, recurrence:R(nextMonthStart, {freq:'month', monthDay:1})}]},
    {id: uid(), name:'New bike', target:800, sample:true, contributions:[c(-50, 500), c(-20, 300)], plans:[]}
  ];
  const T = (title, horizon, rec, extra) => Object.assign({id: uid(), title, horizon, recurrence: rec || null, done:false, completedAt:'', doneDates:{}, sample:true}, extra || {});
  const tasks = [
    T('Prep meals for tomorrow', 'today', R(today)),
    T('Stretch for 10 minutes', 'today', null, {done:true, completedAt:today}),
    T('Refill water bottle', 'today'),
    T('Buy new lifting straps', 'week', R(d(3))),
    T('Take progress photos', 'week', R(d(-14), {freq:'week', weekdays:[6]})),
    T('Book a sports massage', 'month', R(d(12))),
    T('Review my savings plan', 'month'),
    T('Run a 10K race', 'year'),
    T('Squat 225 lb for 5 reps', 'year')
  ];
  const checks = (from, pred) => { const o = {}; Dates.range(d(from), d(-1)).forEach((x, i) => { if(pred(x, i)) o[x] = true; }); return o; };
  const medRec = R(d(-42), {freq:'week', weekdays:[0,2,4]});
  const habits = [
    {id: uid(), name:'Drink 8 glasses of water', freq:'daily', target:1, start:d(-40), recurrence:null, checks:checks(-40, (x, i) => i % 9 !== 4), sample:true},
    {id: uid(), name:'Read for 20 minutes', freq:'weekly', target:3, start:d(-56), recurrence:null, checks:checks(-56, (x, i) => i % 2 === 0), sample:true},
    {id: uid(), name:'Meditate', freq:'custom', target:1, start:medRec.start, recurrence:medRec, checks:(() => { const o = {}; Recurrence.expand(medRec, d(-42), d(-1)).forEach((x, i) => { if(i !== 5) o[x] = true; }); return o; })(), sample:true},
    {id: uid(), name:'Call family', freq:'monthly', target:2, start:d(-120), recurrence:null, checks:checks(-120, (x, i) => i % 13 === 0), sample:true}
  ];
  const xi = (name, amount, n) => ({id: uid(), name, amount, date: d(n)});
  const expenses = [
    {id: uid(), name:'Bathroom reno', budget:8000, sample:true, items:[xi('Tiles', 1250, -40), xi('Vanity and sink', 1480, -32), xi('Plumber', 2200, -21), xi('Paint and supplies', 310, -9)]},
    {id: uid(), name:'Christmas', budget:1200, sample:true, items:[xi('Gifts for kids', 540, -12), xi('Tree and decorations', 185, -6), xi('Dinner groceries', 260, -2), xi('Wrapping paper', 45, -1), xi('Cards and stamps', 38, -1), xi('Secret Santa', 50, 0), xi('Stocking stuffers', 120, 0)]}
  ];
  const notes = [
    {id: uid(), title:'Gym bag checklist', sample:true, updated: Date.now() - 86400000, html:'<div><b>Pack the night before</b></div><ul><li>Lifting shoes</li><li>Belt and straps</li><li>Water bottle</li><li>Pre-workout snack</li></ul>'},
    {id: uid(), title:'Bathroom reno ideas', sample:true, updated: Date.now() - 3 * 86400000, html:'<div><font size="5">Plan</font></div><ol><li>Pick tiles <i>(matte grey?)</i></li><li>Get 3 quotes from plumbers</li><li>Order vanity</li></ol><div>Keep spending <b>under budget</b>.</div>'}
  ];
  const occasions = [
    {id: uid(), title:"Mom's birthday", date: Dates.make(1962, ...Dates.ymd(d(9)).slice(1)), yearly:true, sample:true},
    {id: uid(), title:'Wedding anniversary', date: Dates.make(2016, ...Dates.ymd(d(24)).slice(1)), yearly:true, sample:true}
  ];
  return {templates, sessions, supplements, goals, expenses, tasks, habits, notes, occasions, exercises: [...names].map(n => ({name:n, sample:true}))};
}
function loadSampleData(){
  clearSampleData();
  const s = normalizeState(Object.assign({settings: state.settings}, buildSampleData(Dates.today())));
  for(const k of ['templates','sessions','supplements','goals','expenses','tasks','habits','notes','occasions']) state[k] = state[k].concat(s[k]);
  for(const e of s.exercises) if(!state.exercises.some(x => x.name.toLowerCase() === e.name.toLowerCase())) state.exercises.push(e);
  commit(); toast('Sample data loaded — have a look around');
}

function effectiveTheme(){
  const t = state.settings.theme;
  if(t === 'system') return mqDark && mqDark.matches ? 'dark' : 'light';
  return t;
}
function applyTheme(){
  const t = effectiveTheme();
  document.documentElement.dataset.theme = t;
  const btn = $('#themeBtn');
  btn.innerHTML = icon(t === 'dark' ? 'light' : 'dark');
  btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  btn.title = btn.getAttribute('aria-label');
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', t === 'dark' ? '#111214' : '#f6f8fc');
}
function renderNav(){
  const link = r => `<a class="nav-item" href="#/${r.id}" style="--c:${r.color}" ${ui.route === r.id ? 'aria-current="page"' : ''}>${icon(r.icon)}<span>${r.label}</span></a>`;
  $('#drawer').innerHTML = `<div class="drawer-head"><span class="brand-mark">${icon('logo')}</span><span>${esc(APP_NAME)}</span></div>` +
    ROUTES.filter(r => r.id !== 'settings').map(link).join('') + '<div class="nav-sep"></div>' + link(ROUTES.find(r => r.id === 'settings'));

    `<button type="button" data-act="openDrawer" aria-label="More pages">${icon('menu')}<span>More</span></button>`;

const VIEWS = {dashboard: viewDashboard, calendar: viewCalendar, workouts: viewWorkouts, supplements: viewSupplements, savings: viewSavings, expenses: viewExpenses, tasks: viewTasks, habits: viewHabits, notes: viewNotes, dates: viewDates, settings: viewSettings};
function banners(){

function routeFromHash(){

    const t = byId(state.tasks, el.dataset.id); if(!t) return;
    if(await confirmBox({title:'Delete task?', message:`“${esc(t.title)}” will be removed${taskIsRepeating(t) ? ', including all its future dates' : ''}.`, ok:'Delete', danger:true}))
      withUndo('Task deleted', () => { state.tasks = state.tasks.filter(x => x.id !== t.id); });
  },
  async clearCompleted(){
    const today = Dates.today();
    const n = state.tasks.filter(t => !taskIsRepeating(t) && taskIsDone(t, today)).length;
    if(!n) return;
    if(await confirmBox({title:'Clear completed tasks?', message:`${plural(n, 'finished task')} will be removed. Repeating tasks stay, since they come back.`, ok:'Clear', danger:true}))
      withUndo(`Cleared ${plural(n, 'task')}`, () => { state.tasks = state.tasks.filter(t => taskIsRepeating(t) || !t.done); });
  },
  newWorkout(){ openWorkoutEditor(null); },
  editWorkout(el){ openWorkoutEditor(el.dataset.id); },
  dupWorkout(el){
    const t = byId(state.templates, el.dataset.id); if(!t) return;
    const copy = clone(t); copy.id = uid(); copy.name = (t.name + ' (copy)').slice(0, 80); copy.schedule = null; copy.sample = false;
    copy.exercises.forEach(e => { e.id = uid(); });
    state.templates.splice(state.templates.indexOf(t) + 1, 0, copy);
    commit(); toast('Workout duplicated'); openWorkoutEditor(copy.id);
  },
  async delWorkout(el){
    const t = byId(state.templates, el.dataset.id); if(!t) return;
    if(await confirmBox({title:'Delete workout?', message:`“${esc(t.name)}” and its calendar dates will be removed. Workouts you already logged are kept in History.`, ok:'Delete', danger:true}))
      withUndo('Workout deleted', () => { state.templates = state.templates.filter(x => x.id !== t.id); });
  },
  startWorkout(el){ openSessionLogger({templateId: el.dataset.id, date: el.dataset.date || Dates.today()}); },
  pickWorkout(){ openWorkoutPicker(Dates.today()); },
  viewSession(el){ openSessionLogger({sessionId: el.dataset.id}); },
  async delSession(el){
    const s = byId(state.sessions, el.dataset.id); if(!s) return;
    if(await confirmBox({title:'Delete this workout log?', message:`“${esc(s.name)}” on ${esc(fmtDate(s.date, 'long'))} will be removed.`, ok:'Delete', danger:true}))
      withUndo('Workout log deleted', () => { state.sessions = state.sessions.filter(x => x.id !== s.id); });
  },
  wTab(el){ ui.wTab = oneOf(el.dataset.tab, ['workouts','history','library'], 'workouts'); render(); },
  delExercise(el){ const n = el.dataset.name; withUndo(`Removed “${n}” from suggestions`, () => { state.exercises = state.exercises.filter(e => e.name !== n); }); },
  newSupp(){ openSuppEditor(null); },
  editSupp(el){ openSuppEditor(el.dataset.id); },
  async delSupp(el){
    const s = byId(state.supplements, el.dataset.id); if(!s) return;
    if(await confirmBox({title:'Delete supplement?', message:`“${esc(s.name)}” and its check-off history will be removed.`, ok:'Delete', danger:true}))
      withUndo('Supplement deleted', () => { state.supplements = state.supplements.filter(x => x.id !== s.id); });
  },
  newGoal(){ openGoalEditor(null); },
  editGoal(el){ openGoalEditor(el.dataset.id); },
  async delGoal(el){
    const g = byId(state.goals, el.dataset.id); if(!g) return;
    if(await confirmBox({title:'Delete goal?', message:`“${esc(g.name)}”, its ${plural(g.contributions.length, 'contribution')} and plans will be removed.`, ok:'Delete', danger:true}))
      withUndo('Goal deleted', () => { state.goals = state.goals.filter(x => x.id !== g.id); });
  },
  addMoney(el){ openContribEditor(el.dataset.id, null, null); },
  editContrib(el){ openContribEditor(el.dataset.id, el.dataset.x, null); },
  async delContrib(el){
    const g = byId(state.goals, el.dataset.id); if(!g) return;
    const c = g.contributions.find(x => x.id === el.dataset.x); if(!c) return;
    if(await confirmBox({title:'Delete contribution?', message:`${fmtMoney(c.amount)} on ${esc(fmtDate(c.date, 'long'))} will be removed from ${esc(g.name)}.`, ok:'Delete', danger:true}))
      withUndo('Contribution deleted', () => { g.contributions = g.contributions.filter(x => x.id !== c.id); });
  },
  newPlan(el){ openPlanEditor(el.dataset.id, null); },
  editPlan(el){ openPlanEditor(el.dataset.id, el.dataset.x); },
  async delPlan(el){
    const g = byId(state.goals, el.dataset.id); if(!g) return;
    if(await confirmBox({title:'Delete planned contribution?', message:'It will be removed from your calendar. Money you already saved is not affected.', ok:'Delete', danger:true}))
      withUndo('Plan deleted', () => { g.plans = g.plans.filter(x => x.id !== el.dataset.x); });
  },
  toggleGoal(el){ ui.openGoals[el.dataset.id] = !ui.openGoals[el.dataset.id]; render(); },
  newOccasion(){ openOccasionEditor(null); },
  editOccasion(el){ openOccasionEditor(el.dataset.id); },
  delOccasion(el){ deleteOccasion(el.dataset.id); },
  newExpense(){ openExpenseEditor(null); },
  editExpense(el){ openExpenseEditor(el.dataset.id); },
  async delExpense(el){
    const e = byId(state.expenses, el.dataset.id); if(!e) return;
    if(await confirmBox({title:'Delete budget?', message:`“${esc(e.name)}” and its ${plural(e.items.length, 'expense')} will be removed.`, ok:'Delete', danger:true}))
      withUndo('Budget deleted', () => { state.expenses = state.expenses.filter(x => x.id !== e.id); });
  },
  addExpItem(el){ openExpenseItemEditor(el.dataset.id, null); },
  editExpItem(el){ openExpenseItemEditor(el.dataset.id, el.dataset.x); },
  async delExpItem(el){
    const e = byId(state.expenses, el.dataset.id); if(!e) return;
    const i = e.items.find(x => x.id === el.dataset.x); if(!i) return;
    if(await confirmBox({title:'Delete expense?', message:`“${esc(i.name)}” (${fmtMoney(i.amount)}) will be removed from ${esc(e.name)}.`, ok:'Delete', danger:true}))
      withUndo('Expense deleted', () => { e.items = e.items.filter(x => x.id !== i.id); });
  },
  newNote(){
    NoteEd.flush();
    const n = {id: uid(), title: '', html: '', updated: Date.now(), sample: false};
    state.notes.push(n); ui.noteId = n.id; ui.refocus = '[data-note-title]';
    commit();
  },
  dashNote(el){ ui.noteId = el.dataset.id; goTo('notes'); },
  openNote(el){ NoteEd.flush(); ui.noteId = el.dataset.id; NoteEd.range = null; render(); },
  async delNote(el){
    NoteEd.flush();
    const n = byId(state.notes, el.dataset.id); if(!n) return;
    if(await confirmBox({title:'Delete note?', message:`“${esc(n.title || 'Untitled')}” will be removed.`, ok:'Delete', danger:true}))
      withUndo('Note deleted', () => { state.notes = state.notes.filter(x => x.id !== n.id); if(ui.noteId === n.id) ui.noteId = null; });
  },
  toggleExpense(el){ ui.openExpenses[el.dataset.id] = !ui.openExpenses[el.dataset.id]; render(); },
  newHabit(){ openHabitEditor(null); },
  editHabit(el){ openHabitEditor(el.dataset.id); },
  async delHabit(el){
    const h = byId(state.habits, el.dataset.id); if(!h) return;
    if(await confirmBox({title:'Delete habit?', message:`“${esc(h.name)}” and all its check-ins will be removed.`, ok:'Delete', danger:true}))
      withUndo('Habit deleted', () => { state.habits = state.habits.filter(x => x.id !== h.id); });
  },
  habitToday(el){
    const h = byId(state.habits, el.dataset.id); if(!h) return;
    const today = Dates.today();
    if(h.checks[today]) delete h.checks[today];
    else if(HabitLogic.isDue(h, today)) h.checks[today] = true;
    ui.refocus = `[data-act="habitToday"][data-id="${h.id}"]`;
    commit();
  },
  habitOtherDay(el){ openHabitDayPicker(el.dataset.id); },
  exportData,
  importData(){ $('#importFile').click(); },
  clearAll: clearAllData,
  async loadSample(){
    const has = ['templates','supplements','goals','expenses','tasks','habits','notes','occasions'].some(k => state[k].some(x => x.sample));
    if(has && !(await confirmBox({title:'Reload sample data?', message:'The existing sample items will be replaced with fresh ones. Your own items are not touched.', ok:'Reload'}))) return;
    loadSampleData();
  },
  async clearSample(){
    if(await confirmBox({title:'Clear sample data?', message:'All example items will be removed, including any you edited. Items you created yourself are kept.', ok:'Clear samples', danger:true}))
      withUndo('Sample data cleared', clearSampleData);
  },
  recExport(){ download(`daytrak-damaged-${Dates.today()}.txt`, ui.recovery ? ui.recovery.raw : '', 'text/plain'); },
  async recReset(){
    if(!(await confirmBox({title:'Start fresh?', message:'The damaged data will be deleted from this browser. Download a copy first if you might need it.', ok:'Start fresh', danger:true}))) return;
    Storage.clear(); ui.recovery = null; state = emptyState(); applyTheme(); commit(); toast('Started fresh');
  }
};
/* Change actions (data-chg) */
const CHG = {
  task(el){
    const t = byId(state.tasks, el.dataset.id); if(!t) return;
    const today = Dates.today();
    const d = taskIsRepeating(t) ? taskCurrentDate(t, today) : null;
    setTaskDoneOn(t, d, el.checked, today);
    ui.refocus = `[data-chg="task"][data-id="${t.id}"]`;
    commit();
    if(el.checked) toast('Task done', () => { setTaskDoneOn(t, d, false, today); commit(); });
  },
  supp(el){
    const s = byId(state.supplements, el.dataset.id); if(!s || !Dates.isValid(el.dataset.date)) return;
    if(el.checked) s.log[el.dataset.date] = true; else delete s.log[el.dataset.date];
    ui.refocus = `[data-chg="supp"][data-id="${s.id}"]`;
    commit();
  },
  habit(el){
    const h = byId(state.habits, el.dataset.id); if(!h || !Dates.isValid(el.dataset.date)) return;
    if(el.checked) h.checks[el.dataset.date] = true; else delete h.checks[el.dataset.date];
    ui.refocus = `[data-chg="habit"][data-id="${h.id}"]`;
    commit();
  },
  name(el){ state.settings.name = str(el.value, 40); commit(); toast(state.settings.name ? `Hi, ${state.settings.name}!` : 'Name removed'); },
  units(el){ state.settings.units = oneOf(el.value, ['metric','imperial'], 'metric'); commit(); toast(`Showing weights in ${displayUnit()}`); },
  theme(el){ state.settings.theme = oneOf(el.value, ['light','dark','system'], 'system'); applyTheme(); commit(); },
  weekStart(el){ state.settings.weekStart = oneOf(el.value, ['mon','sun'], 'mon'); commit(); toast(`Calendar weeks now start on ${state.settings.weekStart === 'sun' ? 'Sunday' : 'Monday'}`); },
  importFile(el){
    const f = el.files && el.files[0];
    el.value = '';
    if(!f) return;
    importFile(f);
  }
};
/* Form submits (data-form) */
const FORMS = {
  quickTask(form){
    const inp = form.querySelector('[name=title]');
    const title = inp.value.trim();
    if(!title){ inp.setAttribute('aria-invalid', 'true'); inp.focus(); toast('Type a task first.'); return; }
    state.tasks.push({id: uid(), title: title.slice(0, 200), horizon: oneOf(form.querySelector('[name=horizon]').value, HORIZONS.map(h => h.id), 'today'), recurrence: null, done:false, completedAt:'', doneDates:{}, sample:false});
    ui.refocus = '[data-form="quickTask"] [name=title]';
    commit(); toast('Task added');
  },
  addExercise(form){
    const inp = form.querySelector('[name=exname]');
    const n = inp.value.trim();
    if(!n){ inp.setAttribute('aria-invalid', 'true'); inp.focus(); return; }
    if(state.exercises.some(e => e.name.toLowerCase() === n.toLowerCase())){ toast('That exercise is already saved.'); return; }
    addToLibrary([n]);
    ui.refocus = '[data-form="addExercise"] [name=exname]';
    commit(); toast('Exercise saved');
  }
};
function safely(fn){ try { const r = fn(); if(r && typeof r.catch === 'function') r.catch(() => toast('Something went wrong. Your data is safe.')); } catch(e){ toast('Something went wrong. Your data is safe.'); } }

function bindEvents(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if(!el || el.disabled) return;
    const fn = ACT[el.dataset.act]; if(!fn) return;
    e.preventDefault();
    safely(() => fn(el, e));
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-chg]'); if(!el) return;
    const fn = CHG[el.dataset.chg]; if(fn) safely(() => fn(el, e));
  });
  document.addEventListener('submit', e => {
    const form = e.target.closest('[data-form]'); if(!form) return;
    e.preventDefault();
    const fn = FORMS[form.dataset.form]; if(fn) safely(() => fn(form, e));
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      const top = Modal.top();
      if(top){ top.close(); e.preventDefault(); }
      else if($('#drawer').classList.contains('open')){ closeDrawer(); $('#menuBtn').focus(); }
    } else if(e.key === 'Tab'){
      const top = Modal.top(); if(!top) return;
      const f = [...top.el.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
      if(!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if(e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
      else if(!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
      else if(!top.el.contains(document.activeElement)){ first.focus(); e.preventDefault(); }
    } else if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('mcell')){
      e.preventDefault(); openDayPanel(e.target.dataset.date);
    }
  });
  // Menu/page links are handled in-app so navigation works even where the page can't change its own URL
  // (e.g. file previews that load the app as a data: URL). The address bar is updated when allowed.
  document.addEventListener('click', e => {
    if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest('a[href^="#/"]'); if(!a) return;
    e.preventDefault();
    goTo(a.getAttribute('href').slice(2));
  });
  window.addEventListener('popstate', afterRouteChange);
  document.addEventListener('pointerdown', e => DashDrag.start(e));
  window.addEventListener('hashchange', () => {
    routeFromHash(); afterRouteChange();
  });
  const onMq = (mq, fn) => { if(!mq) return; if(mq.addEventListener) mq.addEventListener('change', fn); else if(mq.addListener) mq.addListener(fn); };
  onMq(mqDark, () => { if(state.settings.theme === 'system') applyTheme(); });
  onMq(mqNarrow, () => { ui.narrow = mqNarrow.matches; if(ui.route === 'calendar') render(); });
  window.addEventListener('error', () => { toast('Something went wrong. Your data is safe.'); });
  window.addEventListener('unhandledrejection', e => { e.preventDefault(); toast('Something went wrong. Your data is safe.'); });
  /* Refresh "today" when the date changes while the page is open. */
  let lastDay = Dates.today();
  setInterval(() => { const d = Dates.today(); if(d !== lastDay){ lastDay = d; if(!Modal.stack.length) render(); } }, 60000);
}

function boot(){
  document.title = APP_NAME;
  $('#brandName').textContent = APP_NAME;
  $('#brandMark').innerHTML = icon('logo');
  $('#menuBtn').innerHTML = icon('menu');
  ui.narrow = !!(mqNarrow && mqNarrow.matches);
  Storage.init();
  const res = Storage.read();
  if(res.status === 'ok'){
    state = res.data;
    if(res.skipped) ui.notice = `${plural(res.skipped, 'saved entry', 'saved entries')} couldn't be read and ${res.skipped === 1 ? 'was' : 'were'} skipped. Everything else loaded normally.`;
  } else if(res.status === 'corrupt'){
    ui.recovery = {raw: res.raw};
  } else {
    state = emptyState();
  }
  applyTheme();
  routeFromHash();
  bindEvents();
  render();
}
boot();
</script>
</body>
